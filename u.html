<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>vibestats profile</title>
  <meta name="description" content="A persistent vibestats profile for Claude Code users.">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root {
      --bg: #06060a;
      --surface: #0d0d14;
      --surface-2: #14141e;
      --border: #252535;
      --text: #e0e0e0;
      --text-muted: #8888a0;
      --text-dim: #555568;
      --accent: #6b8fff;
      --green: #22c55e;
      --purple: #a78bfa;
      --mono: 'JetBrains Mono', 'SF Mono', Monaco, Consolas, monospace;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .shell {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 56px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 40px;
    }
    .brand {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .btn:hover { border-color: var(--accent); color: #fff; }
    .btn.primary {
      border-color: rgba(107,143,255,0.45);
      background: linear-gradient(135deg, rgba(107,143,255,0.18), rgba(167,139,250,0.12));
      color: #9bb5ff;
    }
    .loading, .error, .empty {
      min-height: 60vh;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--text-muted);
      font-family: var(--mono);
      line-height: 1.7;
    }
    .error strong, .empty strong { display: block; color: #fff; font-family: var(--sans); font-size: 24px; margin-bottom: 8px; }
    .profile { display: none; }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      gap: 32px;
      align-items: start;
    }
    .identity {
      display: flex;
      gap: 18px;
      align-items: center;
      margin-bottom: 28px;
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.08);
      background: var(--surface-2);
    }
    h1 {
      font-size: clamp(34px, 7vw, 64px);
      line-height: 1;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .handle-meta {
      margin-top: 8px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-dim);
    }
    .pill {
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 5px 10px;
      background: rgba(255,255,255,0.03);
      color: var(--text-muted);
    }
    .archetype-line {
      margin: 22px 0 10px;
      font-size: clamp(28px, 6vw, 52px);
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -0.02em;
    }
    .tagline {
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 16px;
      line-height: 1.6;
      max-width: 620px;
    }
    .signature-row {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .signature-pill {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 7px 11px;
      border-radius: 999px;
      border: 1px solid rgba(107,143,255,0.25);
      background: rgba(107,143,255,0.08);
      color: #c8d5ff;
      font-family: var(--mono);
      font-size: 12px;
    }
    .signature-detail {
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 12px;
    }
    .viral-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 22px;
    }
    .viral-note {
      margin-top: 10px;
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(100px, 1fr));
      gap: 10px;
      margin-top: 28px;
    }
    .metric {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      min-height: 92px;
    }
    .metric-value {
      font-family: var(--mono);
      font-size: 22px;
      color: #fff;
      font-weight: 800;
    }
    .metric-label {
      margin-top: 6px;
      color: var(--text-dim);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .metric-context {
      margin-top: 8px;
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 11px;
    }
    .card {
      background: linear-gradient(145deg, #0d0d18, #12121f);
      border: 1px solid rgba(107,143,255,0.25);
      border-radius: 8px;
      padding: 28px 24px 22px;
      text-align: center;
      position: sticky;
      top: 24px;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--card-gradient);
    }
    .card-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .card-name {
      font-size: 34px;
      font-weight: 900;
      line-height: 1.05;
      background: var(--arch-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .card-score {
      margin: 18px auto 0;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center, #11111d 58%, transparent 60%),
        conic-gradient(var(--card-color) var(--score-deg), rgba(255,255,255,0.07) 0deg);
    }
    .card-score strong {
      font-family: var(--mono);
      font-size: 30px;
      color: #fff;
    }
    .card-note {
      margin-top: 16px;
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.6;
    }
    .spark-section {
      margin-top: 42px;
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(280px, 0.8fr);
      gap: 20px;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }
    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }
    .panel-title {
      font-size: 15px;
      color: #fff;
      font-weight: 700;
    }
    .panel-meta {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
    }
    .sparkline {
      width: 100%;
      height: 180px;
      display: block;
    }
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .timeline-row {
      display: grid;
      grid-template-columns: 96px 1fr 48px;
      gap: 12px;
      align-items: center;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-muted);
    }
    .bar {
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.07);
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      width: var(--w);
      background: var(--card-color);
      border-radius: inherit;
    }
    @media (max-width: 860px) {
      .hero, .spark-section { grid-template-columns: 1fr; }
      .card { position: relative; top: auto; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .identity { align-items: flex-start; }
    }
    @media (max-width: 520px) {
      .topbar { align-items: flex-start; }
      .nav { flex-direction: column; align-items: stretch; }
      .btn { width: 100%; }
      .avatar { width: 64px; height: 64px; border-radius: 14px; }
      .summary-grid { grid-template-columns: 1fr; }
      .timeline-row { grid-template-columns: 82px 1fr 42px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topbar">
      <a class="brand" href="/">vibestats</a>
      <div class="nav" id="nav"></div>
    </nav>

    <div class="loading" id="loading">Loading profile...</div>
    <div class="error" id="error" style="display:none"></div>

    <section class="profile" id="profile">
      <div class="hero">
        <div>
          <div class="identity">
            <img class="avatar" id="avatar" alt="">
            <div>
              <h1 id="handle"></h1>
              <div class="handle-meta" id="handle-meta"></div>
            </div>
          </div>
          <div class="archetype-line" id="archetype-line"></div>
          <p class="tagline" id="tagline"></p>
          <div class="signature-row" id="signature-row"></div>
          <div class="viral-actions">
            <a class="btn primary" id="compare-cta" href="/">Compare with this profile</a>
            <button class="btn" id="copy-profile" type="button">Copy profile</button>
          </div>
          <div class="viral-note" id="viral-note"></div>
          <div class="summary-grid" id="summary-grid"></div>
        </div>

        <aside class="card" id="archetype-card">
          <div class="card-label">current vibecoding personality</div>
          <div class="card-name" id="card-name"></div>
          <div class="card-score" id="card-score"><strong id="score-value"></strong></div>
          <div class="card-note" id="card-note"></div>
        </aside>
      </div>

      <div class="spark-section">
        <section class="panel">
          <div class="panel-head">
            <div class="panel-title">Evolution</div>
            <div class="panel-meta" id="spark-meta"></div>
          </div>
          <svg class="sparkline" id="sparkline" viewBox="0 0 640 180" role="img" aria-label="Archetype score history"></svg>
        </section>
        <section class="panel">
          <div class="panel-head">
            <div class="panel-title">Recent uploads</div>
            <div class="panel-meta" id="timeline-count"></div>
          </div>
          <div class="timeline" id="timeline"></div>
        </section>
      </div>
    </section>
  </main>

  <script>
    const ARCHETYPES = {
      orchestrator: { name: 'THE ORCHESTRATOR', tagline: "You don't code — you conduct.", color: '#6B8FFF', gradient: 'linear-gradient(135deg, #6B8FFF, #a78bfa)', borderGradient: 'linear-gradient(90deg, transparent, #6B8FFF, #a78bfa, transparent)' },
      shipper: { name: 'THE SHIPPER', tagline: 'Done is better than perfect. You live this.', color: '#22c55e', gradient: 'linear-gradient(135deg, #22c55e, #22d3ee)', borderGradient: 'linear-gradient(90deg, transparent, #22c55e, #22d3ee, transparent)' },
      architect: { name: 'THE ARCHITECT', tagline: 'You read before you write. You plan before you build.', color: '#3b82f6', gradient: 'linear-gradient(135deg, #6B8FFF, #3b82f6)', borderGradient: 'linear-gradient(90deg, transparent, #6B8FFF, #3b82f6, transparent)' },
      debugger: { name: 'THE DEBUGGER', tagline: "You don't guess. You investigate.", color: '#f59e0b', gradient: 'linear-gradient(135deg, #f59e0b, #ef4444)', borderGradient: 'linear-gradient(90deg, transparent, #f59e0b, #ef4444, transparent)' },
      polyglot: { name: 'THE POLYGLOT', tagline: 'One language is never enough.', color: '#ff79c6', gradient: 'linear-gradient(135deg, #ff79c6, #f59e0b, #22c55e, #6B8FFF)', borderGradient: 'linear-gradient(90deg, transparent, #ff79c6, #22c55e, #6B8FFF, transparent)' },
      sprinter: { name: 'THE SPRINTER', tagline: 'Fast, focused, ferocious.', color: '#ef4444', gradient: 'linear-gradient(135deg, #ef4444, #ff79c6)', borderGradient: 'linear-gradient(90deg, transparent, #ef4444, #ff79c6, transparent)' },
      deepdiver: { name: 'THE DEEP DIVER', tagline: "You go deep, not wide.", color: '#3b82f6', gradient: 'linear-gradient(135deg, #3b82f6, #1e40af)', borderGradient: 'linear-gradient(90deg, transparent, #3b82f6, #1e40af, transparent)' },
      builder: { name: 'THE BUILDER', tagline: "You build things that didn't exist before.", color: '#22c55e', gradient: 'linear-gradient(135deg, #22c55e, #16a34a)', borderGradient: 'linear-gradient(90deg, transparent, #22c55e, #16a34a, transparent)' },
    };

    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = (n) => Number(n || 0).toLocaleString();
    const shortDate = (value) => new Date(value).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    const SUB_PREFIXES = {
      orchestrator: 'parallel', shipper: 'high-velocity', architect: 'methodical',
      debugger: 'investigative', polyglot: 'multi-stack', sprinter: 'rapid-fire',
      deepdiver: 'deep-session', builder: 'prolific',
    };
    const ARCHETYPE_SHORT_NAMES = {
      orchestrator: 'Orchestrator', shipper: 'Shipper', architect: 'Architect',
      debugger: 'Debugger', polyglot: 'Polyglot', sprinter: 'Sprinter',
      deepdiver: 'Deep Diver', builder: 'Builder',
    };

    function handleFromLocation() {
      const query = new URLSearchParams(location.search).get('handle');
      if (query) return query;
      return location.pathname.split('/').filter(Boolean).pop() || '';
    }

    function fallbackSignature(scores, primary) {
      const sorted = Object.entries(scores || {})
        .filter(([key]) => key !== primary && !key.startsWith('_') && ARCHETYPES[key])
        .sort((a, b) => Number(b[1] || 0) - Number(a[1] || 0));
      if (!sorted.length) return null;
      const secondary = sorted[0][0];
      return {
        label: `${SUB_PREFIXES[secondary] || secondary} ${ARCHETYPE_SHORT_NAMES[primary] || primary}`,
        combo: `${secondary}+${primary}`,
        secondary,
      };
    }

    function vibeSignature(upload) {
      const fallback = fallbackSignature(upload.scores, upload.archetype);
      return {
        label: upload.raw_meta?.signature || fallback?.label || '',
        combo: upload.raw_meta?.signatureCombo || fallback?.combo || '',
        secondary: upload.raw_meta?.secondaryArchetype || fallback?.secondary || '',
      };
    }

    async function fetchMe() {
      try {
        const res = await fetch('/api/me');
        if (!res.ok) return null;
        return (await res.json()).user;
      } catch {
        return null;
      }
    }

    function renderNav(me, profileHandle) {
      const nav = document.getElementById('nav');
      if (me) {
        nav.innerHTML = `
          <a class="btn" href="/">Upload</a>
          <a class="btn" href="/settings">Settings</a>
          <a class="btn primary" href="/u/${encodeURIComponent(me.gh_handle)}">@${esc(me.gh_handle)}</a>
        `;
      } else {
        nav.innerHTML = `
          <a class="btn" href="/">Upload</a>
          <a class="btn primary" href="/api/auth/github/start?returnTo=${encodeURIComponent(`/u/${profileHandle}`)}">Sign in with GitHub</a>
        `;
      }
    }

    async function latestForHandle(handle) {
      if (!handle) return null;
      try {
        const res = await fetch(`/api/u/${encodeURIComponent(handle)}`);
        if (!res.ok) return null;
        const profile = await res.json();
        return profile.uploads?.[0] || null;
      } catch {
        return null;
      }
    }

    async function renderViralActions(me, profile, latest) {
      const compareCta = document.getElementById('compare-cta');
      const copyBtn = document.getElementById('copy-profile');
      const note = document.getElementById('viral-note');
      const handle = profile.user.gh_handle;
      const hostArchetype = latest.archetype;
      const profilePath = `/u/${encodeURIComponent(handle)}`;
      const uploadCompareUrl = `/?compareTo=${encodeURIComponent(handle)}&compareArchetype=${encodeURIComponent(hostArchetype)}`;

      compareCta.href = uploadCompareUrl;
      compareCta.textContent = `Compare with @${handle}`;
      note.textContent = 'Upload yours once and vibestats will show your pairing with this profile.';

      if (me && me.gh_handle !== handle) {
        const myLatest = await latestForHandle(me.gh_handle);
        if (myLatest?.archetype) {
          compareCta.href = `/compare?a=${encodeURIComponent(myLatest.archetype)}&b=${encodeURIComponent(hostArchetype)}`;
          compareCta.textContent = `See your pairing with @${handle}`;
          note.textContent = 'Instant comparison from your latest saved profile.';
        }
      } else if (me && me.gh_handle === handle) {
        compareCta.href = `/compare?me=${encodeURIComponent(hostArchetype)}`;
        compareCta.textContent = 'Create a pairing link';
        note.textContent = 'Pick another archetype and share the compatibility result.';
      }

      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(`${location.origin}${profilePath}`);
          copyBtn.textContent = 'Copied!';
          setTimeout(() => { copyBtn.textContent = 'Copy profile'; }, 1500);
        } catch {
          copyBtn.textContent = 'Copy failed';
          setTimeout(() => { copyBtn.textContent = 'Copy profile'; }, 1500);
        }
      });
    }

    function metricContext(value, avg, higherText = 'above avg', lowerText = 'below avg') {
      if (!avg || !value) return '';
      const ratio = value / avg;
      if (ratio >= 1.2) return `${ratio.toFixed(1)}x ${higherText}`;
      if (ratio <= 0.8) return `${(1 / ratio).toFixed(1)}x ${lowerText}`;
      return 'near average';
    }

    function renderSparkline(uploads, archetype, color) {
      const svg = document.getElementById('sparkline');
      const pointsData = uploads.slice(0, 12).reverse().map((upload) => ({
        score: Number(upload.scores?.[archetype] || 0),
        label: shortDate(upload.uploaded_at),
      }));
      document.getElementById('spark-meta').textContent = `${pointsData.length} upload${pointsData.length === 1 ? '' : 's'}`;
      if (pointsData.length === 0) {
        svg.innerHTML = '';
        return;
      }
      const width = 640;
      const height = 180;
      const pad = 22;
      const xStep = pointsData.length > 1 ? (width - pad * 2) / (pointsData.length - 1) : 0;
      const points = pointsData.map((point, i) => {
        const x = pad + xStep * i;
        const y = height - pad - (point.score / 100) * (height - pad * 2);
        return { ...point, x, y };
      });
      const path = points.map((point, i) => `${i === 0 ? 'M' : 'L'} ${point.x.toFixed(1)} ${point.y.toFixed(1)}`).join(' ');
      const circles = points.map((point) => `<circle cx="${point.x}" cy="${point.y}" r="4" fill="${color}"><title>${point.label}: ${point.score}%</title></circle>`).join('');
      const area = `${path} L ${points[points.length - 1].x.toFixed(1)} ${height - pad} L ${points[0].x.toFixed(1)} ${height - pad} Z`;
      svg.innerHTML = `
        <line x1="${pad}" y1="${height - pad}" x2="${width - pad}" y2="${height - pad}" stroke="rgba(255,255,255,0.08)" />
        <path d="${area}" fill="${color}" opacity="0.1"></path>
        <path d="${path}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
        ${circles}
      `;
    }

    function renderTimeline(uploads, color) {
      document.getElementById('timeline-count').textContent = `${uploads.length} total`;
      document.getElementById('timeline').innerHTML = uploads.slice(0, 8).map((upload) => {
        const arch = ARCHETYPES[upload.archetype] || ARCHETYPES.builder;
        const score = Number(upload.scores?.[upload.archetype] || 0);
        return `
          <div class="timeline-row">
            <span>${shortDate(upload.uploaded_at)}</span>
            <div class="bar" style="--card-color:${color}"><span style="--w:${score}%"></span></div>
            <span title="${esc(arch.name)}">${score}%</span>
          </div>
        `;
      }).join('');
    }

    async function renderProfile() {
      const profileHandle = handleFromLocation();
      const [me, profileRes, statsRes] = await Promise.all([
        fetchMe(),
        fetch(`/api/u/${encodeURIComponent(profileHandle)}`),
        fetch('/api/stats').catch(() => null),
      ]);
      renderNav(me, profileHandle);

      if (!profileRes.ok) {
        document.getElementById('loading').style.display = 'none';
        const err = profileRes.status === 404 ? 'Profile not found' : 'Profile unavailable';
        document.getElementById('error').style.display = 'grid';
        document.getElementById('error').innerHTML = `<strong>${esc(err)}</strong><span>${esc(profileHandle)}</span>`;
        return;
      }

      const profile = await profileRes.json();
      const stats = statsRes && statsRes.ok ? await statsRes.json() : null;
      const latest = profile.uploads[0];
      if (!latest) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'grid';
        document.getElementById('error').innerHTML = `<strong>@${esc(profile.user.gh_handle)} has no uploads yet.</strong><a class="btn primary" href="/">Upload insights</a>`;
        return;
      }

      const arch = ARCHETYPES[latest.archetype] || ARCHETYPES.builder;
      const score = Number(latest.scores?.[latest.archetype] || 0);
      const pct = latest.scores?._percentiles?.[latest.archetype];
      const m = latest.metrics || {};
      const avg = stats?.averages || {};
      const signature = vibeSignature(latest);

      document.title = `@${profile.user.gh_handle} is ${signature.label || arch.name} | vibestats`;
      document.documentElement.style.setProperty('--card-color', arch.color);
      document.documentElement.style.setProperty('--arch-gradient', arch.gradient);
      document.documentElement.style.setProperty('--card-gradient', arch.borderGradient);
      document.documentElement.style.setProperty('--score-deg', `${Math.round(score / 100 * 360)}deg`);

      document.getElementById('avatar').src = profile.user.avatar_url || '';
      document.getElementById('avatar').alt = `@${profile.user.gh_handle}`;
      document.getElementById('handle').textContent = `@${profile.user.gh_handle}`;
      document.getElementById('handle-meta').innerHTML = `
        <span>${profile.uploads.length} upload${profile.uploads.length === 1 ? '' : 's'}</span>
        <span>${shortDate(latest.uploaded_at)}</span>
        ${profile.is_owner && profile.user.privacy ? `<span class="pill">${esc(profile.user.privacy)}</span>` : ''}
      `;
      document.getElementById('archetype-line').style.background = arch.gradient;
      document.getElementById('archetype-line').style.WebkitBackgroundClip = 'text';
      document.getElementById('archetype-line').style.WebkitTextFillColor = 'transparent';
      document.getElementById('archetype-line').style.backgroundClip = 'text';
      document.getElementById('archetype-line').textContent = arch.name;
      document.getElementById('tagline').textContent = arch.tagline;
      document.getElementById('signature-row').innerHTML = signature.label ? `
        <span class="signature-pill">${esc(signature.label)}</span>
        <span class="signature-detail">1 of 56 Claude Code signature combos</span>
      ` : '';
      document.getElementById('card-name').textContent = arch.name;
      document.getElementById('score-value').textContent = `${score}%`;
      document.getElementById('card-note').innerHTML = `${pct ? `top ${esc(pct)}% signal` : 'primary archetype signal'}<br>${signature.label ? `${esc(signature.label)}<br>` : ''}${esc(m.days || 0)} days tracked`;

      const summary = [
        ['commits/day', fmt(m.commitsPerDay), metricContext(m.commitsPerDay, avg.commitsPerDay)],
        ['sessions', fmt(m.sessions), metricContext(m.sessions, avg.sessions)],
        ['languages', fmt(m.codeLangCount ?? m.languages), metricContext(m.codeLangCount ?? m.languages, avg.languages)],
        ['msgs/session', fmt(m.msgsPerSession), metricContext(m.msgsPerSession, avg.msgsPerSession)],
        ['days', fmt(m.days), metricContext(m.days, avg.days)],
      ];
      document.getElementById('summary-grid').innerHTML = summary.map(([label, value, context]) => `
        <div class="metric">
          <div class="metric-value">${esc(value)}</div>
          <div class="metric-label">${esc(label)}</div>
          <div class="metric-context">${esc(context || '')}</div>
        </div>
      `).join('');

      renderSparkline(profile.uploads, latest.archetype, arch.color);
      renderTimeline(profile.uploads, arch.color);
      renderViralActions(me, profile, latest);

      document.getElementById('loading').style.display = 'none';
      document.getElementById('profile').style.display = 'block';
    }

    renderProfile().catch((err) => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'grid';
      document.getElementById('error').innerHTML = `<strong>Profile failed</strong><span>${esc(err.message)}</span>`;
    });
  </script>
</body>
</html>
