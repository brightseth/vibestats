<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>vibestats profile</title>
  <meta name="description" content="A persistent vibestats profile for Claude Code users.">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root {
      --bg: #06060a;
      --surface: #0d0d14;
      --surface-2: #14141e;
      --border: #252535;
      --text: #e0e0e0;
      --text-muted: #8888a0;
      --text-dim: #555568;
      --accent: #6b8fff;
      --green: #22c55e;
      --purple: #a78bfa;
      --mono: 'JetBrains Mono', 'SF Mono', Monaco, Consolas, monospace;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .shell {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 56px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 40px;
    }
    .brand {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .btn:hover { border-color: var(--accent); color: #fff; }
    .btn.primary {
      border-color: rgba(107,143,255,0.45);
      background: linear-gradient(135deg, rgba(107,143,255,0.18), rgba(167,139,250,0.12));
      color: #9bb5ff;
    }
    .btn.muted {
      color: var(--text-dim);
      border-color: rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      cursor: default;
    }
    .btn.muted:hover {
      color: var(--text-dim);
      border-color: rgba(255,255,255,0.08);
    }
    .loading, .error, .empty-profile {
      min-height: 60vh;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--text-muted);
      font-family: var(--mono);
      line-height: 1.7;
    }
    .error strong { display: block; color: #fff; font-family: var(--sans); font-size: 24px; margin-bottom: 8px; }
    .empty-profile { display: none; text-align: left; }
    .empty-profile-shell {
      width: min(720px, 100%);
      display: grid;
      gap: 22px;
    }
    .empty-profile-head {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .empty-profile-avatar {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      background: var(--surface-2);
      object-fit: cover;
    }
    .empty-profile-avatar.fallback {
      display: grid;
      place-items: center;
      color: var(--accent);
      font-family: var(--mono);
      font-weight: 800;
    }
    .empty-profile-kicker {
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .empty-profile h1 {
      margin-top: 5px;
      color: #fff;
      font-family: var(--sans);
      font-size: clamp(28px, 6vw, 48px);
      line-height: 1.05;
      letter-spacing: 0;
    }
    .empty-profile-copy {
      max-width: 620px;
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.75;
    }
    .empty-profile-proof {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .empty-proof-item {
      min-height: 96px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      background: rgba(255,255,255,0.03);
    }
    .empty-proof-item strong {
      display: block;
      color: #fff;
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.3;
      margin-bottom: 7px;
    }
    .empty-proof-item span {
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.55;
    }
    .empty-profile-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .profile { display: none; }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      gap: 32px;
      align-items: start;
    }
    .identity {
      display: flex;
      gap: 18px;
      align-items: center;
      margin-bottom: 28px;
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.08);
      background: var(--surface-2);
    }
    h1 {
      font-size: clamp(34px, 7vw, 64px);
      line-height: 1;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .handle-meta {
      margin-top: 8px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-dim);
    }
    .pill {
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 5px 10px;
      background: rgba(255,255,255,0.03);
      color: var(--text-muted);
    }
    .archetype-line {
      margin: 22px 0 10px;
      font-size: clamp(28px, 6vw, 52px);
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -0.02em;
    }
    .tagline {
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 16px;
      line-height: 1.6;
      max-width: 620px;
    }
    .signature-row {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .looking-row {
      margin-top: 12px;
      display: none;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-family: var(--mono);
      font-size: 12px;
    }
    .looking-row.visible { display: flex; }
    .signature-pill {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 7px 11px;
      border-radius: 999px;
      border: 1px solid rgba(107,143,255,0.25);
      background: rgba(107,143,255,0.08);
      color: #c8d5ff;
      font-family: var(--mono);
      font-size: 12px;
    }
    .signature-detail {
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 12px;
    }
    .evolution-pill {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 7px 11px;
      border-radius: 999px;
      border: 1px solid rgba(34,197,94,0.24);
      background: rgba(34,197,94,0.08);
      color: #baf7d0;
      font-family: var(--mono);
      font-size: 12px;
    }
    .evolution-pill.warning {
      border-color: rgba(245,158,11,0.28);
      background: rgba(245,158,11,0.08);
      color: #ffd18a;
    }
    .intent-pill {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 7px 11px;
      border-radius: 999px;
      border: 1px solid rgba(34,197,94,0.24);
      background: rgba(34,197,94,0.08);
      color: #baf7d0;
      text-decoration: none;
    }
    .viral-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 22px;
    }
    .viral-note {
      margin-top: 10px;
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
    }
    .launch-kit-panel {
      display: none;
      margin-top: 18px;
      width: min(660px, 100%);
      border: 1px solid rgba(245,158,11,0.24);
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(245,158,11,0.07), rgba(34,197,94,0.045));
      padding: 16px;
      gap: 12px;
    }
    .launch-kit-panel.visible { display: grid; }
    .launch-kit-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }
    .launch-kit-title {
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      line-height: 1.35;
    }
    .launch-kit-copy {
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.6;
    }
    .launch-kit-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .launch-kit-actions a,
    .launch-kit-actions button {
      min-height: 38px;
      border: 1px solid rgba(245,158,11,0.34);
      border-radius: 8px;
      background: rgba(245,158,11,0.1);
      color: #ffd18a;
      font-family: var(--mono);
      font-size: 12px;
      padding: 9px 12px;
      cursor: pointer;
      text-decoration: none;
    }
    .launch-kit-actions a:hover,
    .launch-kit-actions button:hover { border-color: rgba(245,158,11,0.65); color: #fff; }
    .launch-kit-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .launch-kit-item {
      min-width: 0;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      background: rgba(0,0,0,0.18);
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.5;
      padding: 10px;
      text-decoration: none;
    }
    .launch-kit-item strong {
      display: block;
      overflow: hidden;
      color: #fff;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .launch-kit-item span {
      display: block;
      margin-top: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .launch-kit-code {
      overflow-x: auto;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      background: rgba(0,0,0,0.24);
      color: #f5e6c8;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.5;
      padding: 10px 12px;
      white-space: pre;
    }
    .readme-panel {
      display: none;
      margin-top: 18px;
      width: min(660px, 100%);
      border: 1px solid rgba(34,211,238,0.2);
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(34,211,238,0.07), rgba(107,143,255,0.05));
      padding: 16px;
      gap: 12px;
    }
    .readme-panel.visible { display: grid; }
    .readme-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }
    .readme-title {
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      line-height: 1.35;
    }
    .readme-copy {
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.6;
    }
    .readme-preview {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .readme-preview img {
      max-width: min(100%, 430px);
      min-height: 32px;
      border-radius: 4px;
      background: rgba(0,0,0,0.16);
    }
    .readme-panel button {
      min-height: 38px;
      border: 1px solid rgba(34,211,238,0.34);
      border-radius: 8px;
      background: rgba(34,211,238,0.1);
      color: #bdf3ff;
      font-family: var(--mono);
      font-size: 12px;
      padding: 9px 12px;
      cursor: pointer;
    }
    .readme-panel button:hover { border-color: rgba(34,211,238,0.65); color: #fff; }
    .readme-code {
      overflow-x: auto;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      background: rgba(0,0,0,0.24);
      color: #dbe5ff;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.5;
      padding: 10px 12px;
      white-space: nowrap;
    }
    .credential-panel {
      display: none;
      margin-top: 18px;
      width: min(660px, 100%);
      border: 1px solid rgba(34,197,94,0.22);
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(34,197,94,0.07), rgba(107,143,255,0.045));
      padding: 16px;
      gap: 12px;
    }
    .credential-panel.visible { display: grid; }
    .credential-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }
    .credential-title {
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      line-height: 1.35;
    }
    .credential-copy {
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.6;
    }
    .credential-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .credential-proof {
      min-width: 0;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      background: rgba(0,0,0,0.18);
    }
    .credential-proof strong {
      display: block;
      overflow: hidden;
      color: #fff;
      font-family: var(--mono);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .credential-proof span {
      display: block;
      margin-top: 5px;
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
    }
    .credential-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .credential-actions a,
    .credential-actions button {
      min-height: 38px;
      border: 1px solid rgba(34,197,94,0.32);
      border-radius: 8px;
      background: rgba(34,197,94,0.1);
      color: #baf7d0;
      font-family: var(--mono);
      font-size: 12px;
      padding: 9px 12px;
      cursor: pointer;
      text-decoration: none;
    }
    .credential-actions a:hover,
    .credential-actions button:hover { border-color: rgba(34,197,94,0.62); color: #fff; }
    .reveal-panel {
      display: none;
      margin-top: 18px;
      width: min(660px, 100%);
      border: 1px solid rgba(107,143,255,0.22);
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(107,143,255,0.08), rgba(255,255,255,0.03));
      padding: 16px;
      gap: 12px;
    }
    .reveal-panel.visible { display: grid; }
    .reveal-panel-title {
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      line-height: 1.35;
    }
    .reveal-panel-copy {
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.6;
    }
    .reveal-command-grid {
      display: grid;
      gap: 8px;
    }
    .reveal-command {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
    }
    .reveal-command code {
      min-height: 40px;
      display: flex;
      align-items: center;
      overflow-wrap: anywhere;
      white-space: normal;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      background: rgba(0,0,0,0.24);
      color: #dbe5ff;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.45;
      padding: 10px 12px;
    }
    .reveal-command button {
      min-height: 40px;
      border: 1px solid rgba(107,143,255,0.32);
      border-radius: 8px;
      background: rgba(107,143,255,0.12);
      color: #c8d5ff;
      font-family: var(--mono);
      font-size: 12px;
      padding: 9px 12px;
      cursor: pointer;
    }
    .reveal-command button:hover { border-color: rgba(107,143,255,0.6); color: #fff; }
    .compat-panel {
      display: none;
      margin-top: 20px;
      width: min(620px, 100%);
      border: 1px solid rgba(107,143,255,0.22);
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(107,143,255,0.08), rgba(167,139,250,0.05));
      padding: 16px;
    }
    .compat-panel.visible { display: block; }
    .compat-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      margin-bottom: 12px;
    }
    .compat-title {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .compat-score {
      font-family: var(--mono);
      font-size: 22px;
      color: #fff;
      font-weight: 800;
      white-space: nowrap;
    }
    .compat-bar {
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      margin-bottom: 12px;
    }
    .compat-bar > span {
      display: block;
      height: 100%;
      width: var(--compat-score);
      background: linear-gradient(90deg, var(--accent), var(--purple));
      border-radius: inherit;
    }
    .compat-copy {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.55;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(100px, 1fr));
      gap: 10px;
      margin-top: 28px;
    }
    .achievement-panel {
      display: none;
      margin-top: 16px;
      border: 1px solid rgba(107,143,255,0.2);
      border-radius: 8px;
      background: var(--surface);
      padding: 18px;
    }
    .achievement-panel.visible { display: block; }
    .achievement-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .achievement-title {
      color: #fff;
      font-weight: 800;
      font-size: 15px;
    }
    .achievement-note {
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.45;
      text-align: right;
    }
    .achievement-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }
    .achievement {
      min-height: 104px;
      padding: 13px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      background: rgba(255,255,255,0.03);
    }
    .achievement.scarcity { border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.08); }
    .achievement.rank { border-color: rgba(34,197,94,0.28); background: rgba(34,197,94,0.08); }
    .achievement.moment, .achievement.facet { border-color: rgba(107,143,255,0.24); background: rgba(107,143,255,0.07); }
    .achievement-label {
      color: #c8d5ff;
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .achievement-value {
      margin-top: 8px;
      color: #fff;
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }
    .achievement-detail {
      margin-top: 8px;
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.4;
    }
    .achievement-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }
    .achievement-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 6px 8px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 7px;
      background: rgba(0,0,0,0.16);
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 10px;
      text-decoration: none;
      cursor: pointer;
    }
    .achievement-action:hover { border-color: rgba(107,143,255,0.45); color: #fff; }
    .moment-grid {
      display: none;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .moment-grid.visible { display: grid; }
    .metric {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      min-height: 92px;
    }
    .moment {
      min-height: 92px;
      padding: 14px;
      border: 1px solid rgba(107,143,255,0.2);
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(107,143,255,0.08), rgba(255,255,255,0.03));
    }
    .metric-value {
      font-family: var(--mono);
      font-size: 22px;
      color: #fff;
      font-weight: 800;
      overflow-wrap: anywhere;
    }
    .moment-value {
      color: #fff;
      font-family: var(--mono);
      font-size: 17px;
      line-height: 1.25;
      margin-top: 6px;
    }
    .metric-label {
      margin-top: 6px;
      color: var(--text-dim);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .moment-label {
      color: #c8d5ff;
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .metric-context {
      margin-top: 8px;
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 11px;
    }
    .moment-detail {
      margin-top: 8px;
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.4;
    }
    .facet-panel {
      display: none;
      margin-top: 16px;
      border: 1px solid rgba(107,143,255,0.2);
      border-radius: 8px;
      background: var(--surface);
      padding: 18px;
    }
    .facet-panel.visible { display: block; }
    .facet-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .facet-title {
      color: #fff;
      font-weight: 800;
      font-size: 15px;
    }
    .facet-note {
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.45;
      text-align: right;
    }
    .facet-body {
      display: grid;
      grid-template-columns: minmax(220px, 0.9fr) minmax(0, 1.1fr);
      gap: 18px;
      align-items: center;
    }
    .facet-radar {
      width: 100%;
      aspect-ratio: 1;
      display: block;
    }
    .signals-panel { display: none; flex-direction: column; gap: 18px; }
    .signals-panel.visible { display: flex; }
    .signals-head { font-weight: 700; font-size: 15px; }
    .signals-sub { color: var(--text-dim, #8a8f98); font-size: 12px; margin-top: 2px; }
    .signal-strip { display: flex; flex-direction: column; gap: 6px; }
    .signal-title { font-size: 12px; font-weight: 600; }
    .signal-caption { font-size: 12px; color: var(--text-muted, #b5bac1); }
    .signal-track { display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: rgba(255,255,255,0.05); }
    .signal-seg { height: 100%; }
    .signal-legend { display: flex; flex-wrap: wrap; gap: 10px; font-family: var(--mono, monospace); font-size: 10px; color: var(--text-dim, #8a8f98); }
    .signal-key { display: inline-flex; align-items: center; gap: 4px; }
    .signal-key i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
    .facet-list {
      display: grid;
      gap: 9px;
    }
    .facet-row {
      display: grid;
      grid-template-columns: 132px minmax(0, 1fr) 42px;
      gap: 10px;
      align-items: center;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
    }
    .facet-bar {
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .facet-bar span {
      display: block;
      width: var(--w);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--purple));
    }
    .facet-score {
      color: #fff;
      text-align: right;
      font-weight: 800;
    }
    .card {
      background: linear-gradient(145deg, #0d0d18, #12121f);
      border: 1px solid rgba(107,143,255,0.25);
      border-radius: 8px;
      padding: 28px 24px 22px;
      text-align: center;
      position: sticky;
      top: 24px;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--card-gradient);
    }
    .card-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .card-glyph {
      width: 62px;
      height: 62px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.035);
      color: var(--card-color);
      font-family: var(--mono);
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }
    .card-name {
      font-size: 34px;
      font-weight: 900;
      line-height: 1.05;
      background: var(--arch-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .card-score {
      margin: 18px auto 0;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center, #11111d 58%, transparent 60%),
        conic-gradient(var(--card-color) var(--score-deg), rgba(255,255,255,0.07) 0deg);
    }
    .card-score strong {
      font-family: var(--mono);
      font-size: 30px;
      color: #fff;
    }
    .card-note {
      margin-top: 16px;
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.6;
    }
    .spark-section {
      margin-top: 42px;
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(280px, 0.8fr);
      gap: 20px;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }
    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }
    .panel-title {
      font-size: 15px;
      color: #fff;
      font-weight: 700;
    }
    .panel-meta {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
    }
    .sparkline {
      width: 100%;
      height: 180px;
      display: block;
    }
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .timeline-row {
      display: grid;
      grid-template-columns: 96px 1fr 48px;
      gap: 12px;
      align-items: center;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-muted);
    }
    .bar {
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.07);
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      width: var(--w);
      background: var(--card-color);
      border-radius: inherit;
    }
    @media (max-width: 860px) {
      .hero, .spark-section { grid-template-columns: 1fr; }
      .card { position: relative; top: auto; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .achievement-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .moment-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .facet-body { grid-template-columns: 1fr; }
      .reveal-command { grid-template-columns: 1fr; }
      .reveal-command button { justify-self: start; }
      .identity { align-items: flex-start; }
    }
    @media (max-width: 520px) {
      .topbar { align-items: flex-start; }
      .nav { flex-direction: column; align-items: stretch; }
      .btn { width: 100%; }
      .empty-profile { text-align: center; }
      .empty-profile-head { flex-direction: column; }
      .empty-profile-proof { grid-template-columns: 1fr; }
      .empty-profile-actions { align-items: stretch; flex-direction: column; }
      .avatar { width: 64px; height: 64px; border-radius: 14px; }
      .launch-kit-head { display: grid; }
      .launch-kit-grid { grid-template-columns: 1fr; }
      .readme-head { display: grid; }
      .credential-head { display: grid; }
      .credential-grid { grid-template-columns: 1fr; }
      .summary-grid { grid-template-columns: 1fr; }
      .achievement-grid { grid-template-columns: 1fr; }
      .achievement-head { display: grid; }
      .achievement-note { text-align: left; }
      .moment-grid { grid-template-columns: 1fr; }
      .timeline-row { grid-template-columns: 82px 1fr 42px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topbar">
      <a class="brand" href="/">vibestats</a>
      <div class="nav" id="nav"></div>
    </nav>

    <div class="loading" id="loading">Loading profile...</div>
    <div class="error" id="error" style="display:none"></div>
    <section class="empty-profile" id="empty-profile"></section>

    <section class="profile" id="profile">
      <div class="hero">
        <div>
          <div class="identity">
            <img class="avatar" id="avatar" alt="">
            <div>
              <h1 id="handle"></h1>
              <div class="handle-meta" id="handle-meta"></div>
            </div>
          </div>
          <div class="archetype-line" id="archetype-line"></div>
          <p class="tagline" id="tagline"></p>
          <div class="signature-row" id="signature-row"></div>
          <div class="looking-row" id="looking-row"></div>
          <div class="viral-actions">
            <a class="btn primary" id="compare-cta" href="/">Compare with this profile</a>
            <button class="btn" id="copy-profile" type="button">Copy invite</button>
            <a class="btn" id="share-x" href="https://twitter.com/intent/tweet" target="_blank" rel="noopener">Share on X</a>
            <button class="btn" id="copy-badge" type="button">Copy README badge</button>
            <button class="btn" id="copy-embed" type="button">Copy embed</button>
            <a class="btn" id="credential-cta" href="/" target="_blank" rel="noopener">Credential JSON</a>
            <a class="btn" id="recap-cta" href="/">Recap</a>
            <a class="btn" id="leaderboard-cta" href="/leaderboard">Leaderboard</a>
            <a class="btn" id="browse-cta" href="/browse">Browse similar</a>
            <a class="btn" id="privacy-cta" href="/settings#privacy-settings" style="display:none">Go public</a>
            <a class="btn" id="match-intent-cta" href="/settings#match-settings" style="display:none">Set match intent</a>
            <a class="btn" id="sync-cta" href="/settings#cli-sync" style="display:none">Sync CLI</a>
            <a class="btn" id="digest-cta" href="/settings#weekly-digest-row" style="display:none">Weekly email</a>
            <a class="btn" id="digest-preview-cta" href="/api/digest/preview" target="_blank" rel="noopener" style="display:none">Preview digest</a>
          </div>
          <div class="viral-note" id="viral-note"></div>
          <section class="credential-panel" id="credential-panel" aria-label="Derived credential proof"></section>
          <section class="launch-kit-panel" id="launch-kit-panel" aria-label="Owner launch kit"></section>
          <section class="readme-panel" id="readme-panel" aria-label="GitHub README badge distribution"></section>
          <section class="reveal-panel" id="reveal-panel" aria-label="Reveal your vibestats profile"></section>
          <section class="compat-panel" id="compat-panel"></section>
          <div class="summary-grid" id="summary-grid"></div>
          <section class="achievement-panel" id="achievement-panel" aria-label="Collectible achievements"></section>
          <div class="moment-grid" id="moment-grid" aria-label="Behavioral moments"></div>
          <section class="facet-panel" id="facet-panel" aria-label="Facet radar"></section>
          <section class="signals-panel" id="signals-panel" aria-label="How you build"></section>
        </div>

        <aside class="card" id="archetype-card">
          <div class="card-label">current vibecoding personality</div>
          <div class="card-glyph" id="card-glyph"></div>
          <div class="card-name" id="card-name"></div>
          <div class="card-score" id="card-score"><strong id="score-value"></strong></div>
          <div class="card-note" id="card-note"></div>
        </aside>
      </div>

      <div class="spark-section">
        <section class="panel">
          <div class="panel-head">
            <div class="panel-title">Evolution</div>
            <div class="panel-meta" id="spark-meta"></div>
          </div>
          <svg class="sparkline" id="sparkline" viewBox="0 0 640 180" role="img" aria-label="Archetype score history"></svg>
        </section>
        <section class="panel">
          <div class="panel-head">
            <div class="panel-title">Recent uploads</div>
            <div class="panel-meta" id="timeline-count"></div>
          </div>
          <div class="timeline" id="timeline"></div>
        </section>
      </div>
    </section>
  </main>

  <script src="/lib/compat.js"></script>
  <script src="/api/archetype-identity"></script>
  <script>
    const ARCHETYPES = window.VIBESTATS_ARCHETYPES;

    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = (n) => Number(n || 0).toLocaleString();
    const shortDate = (value) => new Date(value).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    const uploadDateLabel = (upload) => upload?.uploaded_at ? shortDate(upload.uploaded_at) : (upload?.updated?.label || 'recent result');
    const SUB_PREFIXES = {
      orchestrator: 'parallel', shipper: 'high-velocity', architect: 'methodical',
      debugger: 'investigative', polyglot: 'multi-stack', sprinter: 'rapid-fire',
      deepdiver: 'deep-session', builder: 'prolific',
    };
    const ARCHETYPE_SHORT_NAMES = window.VIBESTATS_ARCHETYPE_SHORT_NAMES;
    const INSIGHTS_COMMAND = '/insights';
    const STATUS_COMMAND = 'curl -fsSL https://vibestats.io/cli.sh | sh -s -- status';
    const CLAIM_COMMAND = 'curl -fsSL https://vibestats.io/cli.sh | sh -s --';
    const REVEAL_COMMAND = 'curl -fsSL https://vibestats.io/cli.sh | sh -s -- reveal';
    const INSTALL_CLAUDE_COMMAND = 'curl -fsSL https://vibestats.io/cli.sh | sh -s -- install-claude-command';

    function canonicalVibestatsUrl(pathOrUrl) {
      try {
        return new URL(pathOrUrl || '/', 'https://vibestats.io').toString();
      } catch {
        return 'https://vibestats.io/';
      }
    }

    function profileAttributionRef(handle) {
      const clean = String(handle || '').replace(/^@/, '');
      return /^[A-Za-z0-9-]{1,39}$/.test(clean) ? `u:${clean}` : '';
    }

    function withAttributionRef(pathOrUrl, ref) {
      if (!ref) return pathOrUrl;
      const url = new URL(pathOrUrl || '/', location.origin);
      url.searchParams.set('ref', ref);
      if (/^https?:\/\//i.test(String(pathOrUrl || ''))) return url.toString();
      return `${url.pathname}${url.search}${url.hash}`;
    }

    function handleFromLocation() {
      const query = new URLSearchParams(location.search).get('handle');
      if (query) return query;
      return location.pathname.split('/').filter(Boolean).pop() || '';
    }

    function fallbackSignature(scores, primary) {
      const sorted = Object.entries(scores || {})
        .filter(([key]) => key !== primary && !key.startsWith('_') && ARCHETYPES[key])
        .sort((a, b) => Number(b[1] || 0) - Number(a[1] || 0));
      if (!sorted.length) return null;
      const secondary = sorted[0][0];
      return {
        label: `${SUB_PREFIXES[secondary] || secondary} ${ARCHETYPE_SHORT_NAMES[primary] || primary}`,
        combo: `${secondary}+${primary}`,
        secondary,
      };
    }

    function vibeSignature(upload) {
      const fallback = fallbackSignature(upload.scores, upload.archetype);
      return {
        label: upload.raw_meta?.signature || fallback?.label || '',
        combo: upload.raw_meta?.signatureCombo || fallback?.combo || '',
        secondary: upload.raw_meta?.secondaryArchetype || fallback?.secondary || '',
      };
    }

    function scarcityText(rarity) {
      if (!rarity?.count) return '1 of 56 Claude Code signature combos';
      const plural = rarity.count === 1 ? 'profile' : 'profiles';
      return `${rarity.tier} combo: 1 of ${fmt(rarity.count)} saved ${plural} this month`;
    }

    function shareLabel(upload) {
      const signature = vibeSignature(upload || {});
      return signature.label || ARCHETYPE_SHORT_NAMES[upload?.archetype] || 'Claude Code profile';
    }

    function profileProofLine(profile) {
      const rank = leaderboardText(profile?.leaderboard);
      const rarity = profile?.rarity?.count ? scarcityText(profile.rarity) : '';
      const fallbackRarity = !rank && !rarity ? scarcityText(profile?.rarity) : '';
      const interest = matchInterestText(profile?.match_interest);
      return [
        'GitHub-claimed, derived-only profile',
        rarity || fallbackRarity,
        rank,
        interest,
      ].filter(Boolean).join(' / ');
    }

    function profileInviteText(handle, latest, profileUrl, compareUrl, profile) {
      const proof = profileProofLine(profile);
      return `See how you'd pair with @${handle}, a ${shareLabel(latest)}:${proof ? `\n${proof}` : ''}\n${compareUrl}\nProfile: ${profileUrl}`;
    }

    function achievementShareText(handle, latest, badge, compareUrl) {
      const label = String(badge?.label || 'vibestats badge').replace(/\s+/g, ' ').trim();
      const value = String(badge?.value || '').replace(/\s+/g, ' ').trim();
      const detail = String(badge?.detail || 'derived public profile signal').replace(/\s+/g, ' ').trim();
      const signature = shareLabel(latest);
      return `@${handle}'s vibestats badge: ${label}${value ? ` ${value}` : ''}. ${detail}. ${signature}. Raw /insights stayed local. See how you'd pair: ${compareUrl}`;
    }

    function achievementXShareUrl(text, compareUrl) {
      const params = new URLSearchParams({ text, url: compareUrl });
      return `https://twitter.com/intent/tweet?${params.toString()}`;
    }

    function readmeBadgeMarkdown(handle, badgePath, compareUrl) {
      return `[![vibestats: @${handle}](${canonicalVibestatsUrl(badgePath)})](${compareUrl})`;
    }

    function launchKitText({ handle, latest, profileUrl, compareUrl, credentialUrl, recapUrl, badgeMarkdown, embedHtml, proof }) {
      return [
        `@${handle} on vibestats: ${shareLabel(latest)}`,
        proof || 'GitHub-claimed, derived-only profile',
        `Compare invite: ${compareUrl}`,
        `Profile: ${profileUrl}`,
        `Credential proof: ${credentialUrl}`,
        `Recap: ${recapUrl}`,
        `README badge: ${badgeMarkdown}`,
        `Embed: ${embedHtml}`,
        'Terminal reveal for friends:',
        INSIGHTS_COMMAND,
        STATUS_COMMAND,
        REVEAL_COMMAND,
        CLAIM_COMMAND,
        INSTALL_CLAUDE_COMMAND,
        'Privacy proof: raw /insights stays local; public profile is derived-only.',
      ].filter(Boolean).join('\n');
    }

    async function copyText(text) {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      textarea.remove();
    }

    function leaderboardText(leaderboard) {
      if (!leaderboard?.rank) return '';
      const label = ARCHETYPE_SHORT_NAMES[leaderboard.label] || leaderboard.label || 'archetype';
      const total = leaderboard.total ? ` of ${fmt(leaderboard.total)}` : '';
      return `#${fmt(leaderboard.rank)}${total} on weekly ${label} board`;
    }

    function matchInterestText(interest) {
      if (!interest?.label) return '';
      return `${interest.label} this week`;
    }

    function matchInterestDetail(interest) {
      if (!interest) return '';
      const ownerCount = Number(interest.events || 0);
      if (ownerCount > 0) return `${fmt(ownerCount)} bounded match action${ownerCount === 1 ? '' : 's'} in 7 days`;
      return `${interest.count_bucket || 'active'} bounded match actions in 7 days`;
    }

    function evolutionClass(evolution) {
      return evolution?.type === 'score-drop' ? ' warning' : '';
    }

    function renderCompatibilityPanel(me, myLatest, profile, hostLatest) {
      const panel = document.getElementById('compat-panel');
      if (!panel || !myLatest?.archetype || !hostLatest?.archetype) return;

      const hostHandle = profile.user.gh_handle;
      const visitorType = myLatest.archetype;
      const hostType = hostLatest.archetype;
      const visitorArch = ARCHETYPES[visitorType] || ARCHETYPES.builder;
      const hostArch = ARCHETYPES[hostType] || ARCHETYPES.builder;
      const compat = window.VibeCompat.profileCompatibility(visitorType, hostType, hostHandle, myLatest, hostLatest);
      const pairUrl = `/u/${encodeURIComponent(hostHandle)}/pair/${encodeURIComponent(me.gh_handle)}`;

      panel.classList.add('visible');
      panel.innerHTML = `
        <div class="compat-head">
          <div>
            <div class="compat-title">your pairing</div>
            <div class="compat-copy"><strong>@${esc(me.gh_handle)}</strong> ${esc(visitorArch.name)} x <strong>@${esc(hostHandle)}</strong> ${esc(hostArch.name)}</div>
          </div>
          <div class="compat-score">${esc(compat.score)}%</div>
        </div>
        <div class="compat-bar" style="--compat-score:${esc(compat.score)}%"><span></span></div>
        <div class="compat-copy">${esc(compat.line)} <a href="${pairUrl}">Open full pairing</a></div>
      `;
    }

    function renderLookingFor(profile) {
      const row = document.getElementById('looking-row');
      const match = profile.match || {};
      if (!row || !match.looking_for || match.looking_for === 'idle') {
        if (row) row.classList.remove('visible');
        return;
      }

      const handle = profile.user.gh_handle;
      const contactHref = match.contact_url || `/match?goal=${encodeURIComponent(match.looking_for)}`;
      const contactAttrs = contactHref.startsWith('/') ? '' : ' target="_blank" rel="noopener"';
      row.classList.add('visible');
      row.innerHTML = `
        <span class="intent-pill">looking for ${esc(match.looking_for_label || match.looking_for)}</span>
        <a class="signature-detail" href="${esc(contactHref)}"${contactAttrs}>Contact @${esc(handle)}</a>
      `;
    }

    function renderRevealPanel(me, profile, latest) {
      const panel = document.getElementById('reveal-panel');
      const handle = profile.user.gh_handle;
      if (!panel || sameHandle(me?.gh_handle, handle)) {
        if (panel) {
          panel.classList.remove('visible');
          panel.innerHTML = '';
        }
        return;
      }

      panel.classList.add('visible');
      panel.innerHTML = `
        <div class="reveal-panel-title">@${esc(handle)} is ${esc(shareLabel(latest))}. What are you?</div>
        <div class="reveal-panel-copy">Claude Code has already captured your build fingerprint. Use the no-npm local helper to reveal yours from /insights data; raw sessions stay on your machine.</div>

      const githubUrl = `https://github.com/${encodeURIComponent(handle)}`;
      const initialProof = `@${handle} has a GitHub-claimed, derived-only vibestats profile. Raw /insights stayed local. Verify: ${credentialUrl} Compare: ${compareUrl}`;
      panel.classList.add('visible');
      panel.innerHTML = `

      });

      copyEmbedBtn.addEventListener('click', async () => {
        const iframe = `<iframe src="${canonicalVibestatsUrl(embedPath)}" width="600" height="320" loading="lazy" title="@${handle} on vibestats" style="border:0;border-radius:8px;max-width:100%;"></iframe>`;
        try {
          await copyText(iframe);
          copyEmbedBtn.textContent = 'Embed copied!';
          setTimeout(() => { copyEmbedBtn.textContent = 'Copy embed'; }, 1500);
        } catch {
          copyEmbedBtn.textContent = 'Copy failed';
          setTimeout(() => { copyEmbedBtn.textContent = 'Copy embed'; }, 1500);
        }
      });
    }

    function metricContext(value, avg, higherText = 'above avg', lowerText = 'below avg') {
      if (!avg || !value) return '';
      const ratio = value / avg;
      if (ratio >= 1.2) return `${ratio.toFixed(1)}x ${higherText}`;
      if (ratio <= 0.8) return `${(1 / ratio).toFixed(1)}x ${lowerText}`;
      return 'near average';
    }

    function renderBehavioralMoments(upload) {
      const grid = document.getElementById('moment-grid');
      const moments = Array.isArray(upload?.raw_meta?.moments) ? upload.raw_meta.moments.slice(0, 3) : [];
      if (!moments.length) {
        grid.classList.remove('visible');
        grid.innerHTML = '';
        return;
      }
      grid.classList.add('visible');
      grid.innerHTML = moments.map((moment) => `
        <div class="moment">
          <div class="moment-label">${esc(moment.label || 'Moment')}</div>
          <div class="moment-value">${esc(moment.value || '')}</div>
          <div class="moment-detail">${esc(moment.detail || 'Derived Claude Code signal')}</div>
        </div>
      `).join('');
    }

    function renderAchievements(profile) {
      const panel = document.getElementById('achievement-panel');
      const achievements = Array.isArray(profile?.achievements) ? profile.achievements.slice(0, 5) : [];
      if (!panel || !achievements.length) {
        if (panel) {
          panel.classList.remove('visible');
          panel.innerHTML = '';
        }
        return;
      }

      const latest = profile.uploads?.[0] || {};
      const handle = profile.user?.gh_handle || 'vibecoder';
      const compareUrl = canonicalVibestatsUrl(`/?compareTo=${encodeURIComponent(handle)}&compareArchetype=${encodeURIComponent(latest.archetype || 'builder')}`);

      panel.classList.add('visible');
      panel.innerHTML = `
        <div class="achievement-head">
          <div class="achievement-title">Collectible profile badges</div>
          <div class="achievement-note">copyable scarcity proof<br>raw /insights data stays local</div>
        </div>
        <div class="achievement-grid">
          ${achievements.map((badge) => {
            const share = achievementShareText(handle, latest, badge, compareUrl);
            return `
            <div class="achievement ${esc(badge.tone || 'proof')}">
              <div class="achievement-label">${esc(badge.label || 'Badge')}</div>
              <div class="achievement-value">${esc(badge.value || '')}</div>
              <div class="achievement-detail">${esc(badge.detail || 'Derived public profile signal')}</div>
              <div class="achievement-actions">
                <button class="achievement-action" type="button" data-copy-achievement="${esc(share)}">Copy badge proof</button>
                <a class="achievement-action" href="${esc(achievementXShareUrl(share, compareUrl))}" target="_blank" rel="noopener">Share badge</a>
              </div>
            </div>
          `;
          }).join('')}
        </div>
      `;
      panel.querySelectorAll('[data-copy-achievement]').forEach((button) => {
        button.addEventListener('click', async () => {
          try {
            await copyText(button.getAttribute('data-copy-achievement') || '');
            button.textContent = 'Badge copied!';
          } catch {
            button.textContent = 'Copy failed';
          }
          setTimeout(() => { button.textContent = 'Copy badge proof'; }, 1500);
        });
      });
    }

    function radarPoint(index, total, value, radius = 82, center = 100) {
      const angle = -Math.PI / 2 + (Math.PI * 2 * index) / total;
      const distance = radius * Math.max(0, Math.min(100, Number(value) || 0)) / 100;
      return {
        x: center + Math.cos(angle) * distance,
        y: center + Math.sin(angle) * distance,
      };
    }

    function renderFacetRadar(upload) {
      const panel = document.getElementById('facet-panel');
      const facets = Array.isArray(upload?.facets) ? upload.facets.slice(0, 7) : [];
      if (!panel || facets.length < 3) {
        if (panel) {
          panel.classList.remove('visible');
          panel.innerHTML = '';
        }
        return;
      }

      const total = facets.length;
      const rings = [25, 50, 75, 100].map((value) => {
        const points = facets.map((_, index) => radarPoint(index, total, value));
        return `<polygon points="${points.map((point) => `${point.x.toFixed(1)},${point.y.toFixed(1)}`).join(' ')}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"></polygon>`;
      }).join('');
      const spokes = facets.map((_, index) => {
        const point = radarPoint(index, total, 100);
        return `<line x1="100" y1="100" x2="${point.x.toFixed(1)}" y2="${point.y.toFixed(1)}" stroke="rgba(255,255,255,0.08)" stroke-width="1"></line>`;
      }).join('');
      const polygonPoints = facets.map((facet, index) => {
        const point = radarPoint(index, total, facet.value);
        return `${point.x.toFixed(1)},${point.y.toFixed(1)}`;
      }).join(' ');
      const labels = facets.map((facet, index) => {
        const point = radarPoint(index, total, 113);
        const anchor = point.x < 84 ? 'end' : point.x > 116 ? 'start' : 'middle';
        return `<text x="${point.x.toFixed(1)}" y="${point.y.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle" fill="rgba(224,224,224,0.72)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7">${esc(String(facet.label || '').split(' ')[0] || '')}</text>`;
      }).join('');
      const sorted = facets.slice().sort((a, b) => Number(b.value || 0) - Number(a.value || 0));

      panel.classList.add('visible');
      panel.innerHTML = `
        <div class="facet-head">
          <div class="facet-title">Facet radar</div>
          <div class="facet-note">derived from public archetype scores<br>raw /insights data stays local</div>
        </div>
        <div class="facet-body">
          <svg class="facet-radar" viewBox="-28 -24 256 248" role="img" aria-label="Facet radar chart">
            ${rings}
            ${spokes}
            <polygon points="${polygonPoints}" fill="rgba(107,143,255,0.22)" stroke="var(--accent)" stroke-width="2"></polygon>
            ${facets.map((facet, index) => {
              const point = radarPoint(index, total, facet.value);
              return `<circle cx="${point.x.toFixed(1)}" cy="${point.y.toFixed(1)}" r="3" fill="#fff"><title>${esc(facet.label)} ${esc(facet.value)}%</title></circle>`;
            }).join('')}
            ${labels}
          </svg>
          <div class="facet-list">
            ${sorted.map((facet) => `
              <div class="facet-row" title="${esc(facet.detail || '')}">
                <span>${esc(facet.label)}</span>
                <div class="facet-bar"><span style="--w:${Math.max(0, Math.min(100, Number(facet.value) || 0))}%"></span></div>
                <span class="facet-score">${esc(facet.value)}%</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // Depth layer: counts-only facet distributions ("how you build"). Public surfaces
    // get percentage shapes; owner / opted-in profiles get exact counts (sig.mode).
    function renderFacetSignals(upload) {
      const panel = document.getElementById('signals-panel');
      if (!panel) return;
      const sig = upload && upload.facet_signals;
      if (!sig || typeof sig !== 'object') { panel.classList.remove('visible'); panel.innerHTML = ''; return; }
      const isCounts = sig.mode === 'counts';
      const PALETTE = ['#22c55e', '#6B8FFF', '#f59e0b', '#ff79c6', '#3b82f6', '#84cc16', '#ef4444'];
      const LABELS = {
        outcome_mix: { fully: 'fully achieved', mostly: 'mostly', partially: 'partially', not_achieved: 'not achieved', unclear: 'unclear' },
        helpfulness_mix: { essential: 'essential', very_helpful: 'very helpful', moderately_helpful: 'moderately', slightly_helpful: 'slightly', unhelpful: 'unhelpful' },
        session_type_mix: { multi_task: 'multi-task', single_task: 'single-task', exploration: 'exploration', quick_question: 'quick question', iterative: 'iterative' },
        success_mix: { proactive_help: 'proactive help', multi_file_changes: 'multi-file changes', good_explanations: 'explanations', good_debugging: 'debugging', search: 'search', code_edits: 'code edits', none: 'none' },
        friction_taxonomy: { collaboration: 'collaboration', code: 'code', tooling: 'tooling', platform: 'platform' },
      };
      const TITLES = {
        outcome_mix: 'How your sessions land',
        helpfulness_mix: 'Your partnership grade',
        session_type_mix: 'Your working mode',
        success_mix: 'What you actually ship',
        friction_taxonomy: 'Where it rubs',
      };
      const fmtVal = (n) => (isCounts ? String(n) : `${n}%`);

      function strip(key) {
        const mix = sig[key];
        if (!mix || typeof mix !== 'object') return '';
        const entries = Object.entries(mix).map(([k, v]) => [k, Number(v) || 0]).filter(([, v]) => v > 0);
        if (!entries.length) return '';
        entries.sort((a, b) => b[1] - a[1]);
        const total = entries.reduce((sum, [, v]) => sum + v, 0) || 1;
        const labels = LABELS[key] || {};
        const segs = entries.map(([k, v], i) => `<span class="signal-seg" style="width:${(v / total * 100).toFixed(1)}%;background:${PALETTE[i % PALETTE.length]}" title="${esc(labels[k] || k)} ${fmtVal(v)}"></span>`).join('');
        const legend = entries.map(([k, v], i) => `<span class="signal-key"><i style="background:${PALETTE[i % PALETTE.length]}"></i>${esc(labels[k] || k)} ${fmtVal(v)}</span>`).join('');
        return `<div class="signal-strip"><div class="signal-title">${TITLES[key]}</div><div class="signal-track">${segs}</div><div class="signal-legend">${legend}</div></div>`;
      }

      function share(mix, keys) {
        if (!mix) return 0;
        const total = Object.values(mix).reduce((sum, v) => sum + (Number(v) || 0), 0) || 1;
        const part = keys.reduce((sum, k) => sum + (Number(mix[k]) || 0), 0);
        return part / total;
      }
      // Phrased as interpretations, not diagnoses — these are coarse reads of a small sample.
      const verdicts = [];
      if (share(sig.outcome_mix, ['fully', 'mostly']) >= 0.6) verdicts.push('Looks like you mostly finish what you start.');
      if (share(sig.helpfulness_mix, ['essential', 'very_helpful']) >= 0.6) verdicts.push('Reads like you build with Claude, not just at it.');
      const fr = sig.friction_taxonomy;
      if (fr && (Number(fr.collaboration) || 0) > ((Number(fr.code) || 0) + (Number(fr.tooling) || 0) + (Number(fr.platform) || 0))) {
        verdicts.push('Your friction looks more human than machine.');
      }

      const strips = ['outcome_mix', 'helpfulness_mix', 'session_type_mix', 'success_mix', 'friction_taxonomy'].map(strip).filter(Boolean).join('');
      if (!strips) { panel.classList.remove('visible'); panel.innerHTML = ''; return; }

      const satPos = sig.satisfaction_mix ? Math.round(share(sig.satisfaction_mix, ['positive']) * 100) : null;
      const subBits = [];
      if (sig.sessions_analyzed) subBits.push(`${sig.sessions_analyzed} sessions analyzed`);
      if (satPos != null) subBits.push(`${satPos}% positive sentiment`);
      subBits.push('counts-only · raw /insights stays local');

      panel.classList.add('visible');
      panel.innerHTML = `
        <div>
          <div class="signals-head">How you build${verdicts.length ? ` — ${esc(verdicts[0])}` : ''}</div>
          <div class="signals-sub">${esc(subBits.join(' · '))}</div>
        </div>
        ${strips}`;
    }

    function renderSparkline(uploads, archetype, color, { historyVisible = true } = {}) {
      const svg = document.getElementById('sparkline');
      if (!historyVisible) {
        document.getElementById('spark-meta').textContent = 'history private';
        svg.innerHTML = '<text x="320" y="92" text-anchor="middle" fill="rgba(224,224,224,0.45)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">owner history private</text>';
        return;
      }
      const pointsData = uploads.slice(0, 12).reverse().map((upload) => ({
        score: Number(upload.scores?.[archetype] || 0),
        label: uploadDateLabel(upload),
      }));
      document.getElementById('spark-meta').textContent = `${pointsData.length} upload${pointsData.length === 1 ? '' : 's'}`;
      if (pointsData.length === 0) {
        svg.innerHTML = '';
        return;
      }
      const width = 640;
      const height = 180;
      const pad = 22;
      const xStep = pointsData.length > 1 ? (width - pad * 2) / (pointsData.length - 1) : 0;
      const points = pointsData.map((point, i) => {
        const x = pad + xStep * i;
        const y = height - pad - (point.score / 100) * (height - pad * 2);
        return { ...point, x, y };
      });
      const path = points.map((point, i) => `${i === 0 ? 'M' : 'L'} ${point.x.toFixed(1)} ${point.y.toFixed(1)}`).join(' ');
      const circles = points.map((point) => `<circle cx="${point.x}" cy="${point.y}" r="4" fill="${color}"><title>${point.label}: ${point.score}%</title></circle>`).join('');
      const area = `${path} L ${points[points.length - 1].x.toFixed(1)} ${height - pad} L ${points[0].x.toFixed(1)} ${height - pad} Z`;
      svg.innerHTML = `
        <line x1="${pad}" y1="${height - pad}" x2="${width - pad}" y2="${height - pad}" stroke="rgba(255,255,255,0.08)" />
        <path d="${area}" fill="${color}" opacity="0.1"></path>
        <path d="${path}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
        ${circles}
      `;
    }

    function renderTimeline(uploads, color, { historyVisible = true } = {}) {
      document.getElementById('timeline-count').textContent = historyVisible ? `${uploads.length} total` : 'latest only';
      document.getElementById('timeline').innerHTML = uploads.slice(0, 8).map((upload) => {
        const arch = ARCHETYPES[upload.archetype] || ARCHETYPES.builder;
        const score = Number(upload.scores?.[upload.archetype] || 0);
        return `
          <div class="timeline-row">
            <span>${esc(uploadDateLabel(upload))}</span>
            <div class="bar" style="--card-color:${color}"><span style="--w:${score}%"></span></div>
            <span title="${esc(arch.name)}">${score}%</span>
          </div>
        `;
      }).join('');
    }

    async function renderProfile() {
      const profileHandle = handleFromLocation();
      const [identityStatus, profileRes, statsRes] = await Promise.all([
        fetchIdentityStatus(),
        fetch(`/api/u/${encodeURIComponent(profileHandle)}`),
        fetch('/api/stats').catch(() => null),
      ]);
      const me = identityStatus.profile_save_available === true ? await fetchMe() : null;
      renderNav(me, profileHandle, identityStatus);

      if (!profileRes.ok) {
        document.getElementById('loading').style.display = 'none';
        if (profileRes.status === 404) {
          renderUnknownProfile(me, profileHandle, identityStatus);
          return;
        }
        const err = profileRes.status === 404 ? 'Profile not found' : 'Profile unavailable';
        document.getElementById('error').style.display = 'grid';
        document.getElementById('error').innerHTML = `<strong>${esc(err)}</strong><span>${esc(profileHandle)}</span>`;
        return;
      }

      const profile = await profileRes.json();
      const stats = statsRes && statsRes.ok ? await statsRes.json() : null;
      const latest = profile.uploads[0];
      if (!latest) {
        document.getElementById('loading').style.display = 'none';
        renderEmptyProfile(me, profile, identityStatus);
        return;
      }

      const arch = ARCHETYPES[latest.archetype] || ARCHETYPES.builder;
      const score = Number(latest.scores?.[latest.archetype] || 0);
      const m = latest.metrics || {};
      const activity = latest.activity || {};
      const visibility = profile.metric_visibility || {};
      const canShowCounts = Boolean(profile.is_owner || visibility.show_raw_counts);
      const canShowLanguages = Boolean(profile.is_owner || visibility.show_languages);
      const avg = stats?.averages || {};
      const signature = vibeSignature(latest);
      const streak = profile.streak || null;
      const matchInterest = profile.match_interest || null;

      document.title = `@${profile.user.gh_handle} is ${signature.label || arch.name} | vibestats`;
      document.documentElement.style.setProperty('--card-color', arch.color);
      document.documentElement.style.setProperty('--arch-gradient', arch.gradient);
      document.documentElement.style.setProperty('--card-gradient', arch.borderGradient);
      document.documentElement.style.setProperty('--score-deg', `${Math.round(score / 100 * 360)}deg`);

      document.getElementById('avatar').src = profile.user.avatar_url || '';
      document.getElementById('avatar').alt = `@${profile.user.gh_handle}`;
      document.getElementById('handle').textContent = `@${profile.user.gh_handle}`;
      const historyVisible = profile.history?.visible !== false;
      const uploadCount = profile.history?.total_uploads ?? profile.uploads.length;
      document.getElementById('handle-meta').innerHTML = `
        <span>${historyVisible ? `${uploadCount} upload${uploadCount === 1 ? '' : 's'}` : 'latest public result'}</span>
        <span>${esc(uploadDateLabel(latest))}</span>
        <span class="pill">GitHub-claimed</span>
        <span class="pill">derived-only</span>
        ${streak && (streak.days > 1 || streak.upload_count > 1) ? `<span class="pill">${esc(streak.label)}</span>` : ''}
        ${profile.is_owner && profile.user.privacy ? `<span class="pill">${esc(profile.user.privacy)}</span>` : ''}
      `;
      document.getElementById('archetype-line').style.background = arch.gradient;
      document.getElementById('archetype-line').style.WebkitBackgroundClip = 'text';
      document.getElementById('archetype-line').style.WebkitTextFillColor = 'transparent';
      document.getElementById('archetype-line').style.backgroundClip = 'text';
      document.getElementById('archetype-line').textContent = arch.name;
      document.getElementById('tagline').textContent = arch.tagline;
      const evolution = profile.evolution || null;
      const signatureDetails = [
        evolution?.detail,
        scarcityText(profile.rarity),
        leaderboardText(profile.leaderboard),
        matchInterestText(matchInterest),
      ].filter(Boolean);
      document.getElementById('signature-row').innerHTML = signature.label || evolution || signatureDetails.length ? `
        ${signature.label ? `<span class="signature-pill">${esc(signature.label)}</span>` : ''}
        ${evolution?.label ? `<span class="evolution-pill${evolutionClass(evolution)}">${esc(evolution.label)}</span>` : ''}
        ${signatureDetails.map((detail) => `<span class="signature-detail">${esc(detail)}</span>`).join('')}
      ` : '';
      renderLookingFor(profile);
      document.getElementById('card-name').textContent = arch.name;
      document.getElementById('card-glyph').textContent = arch.glyph || 'VS';
      document.getElementById('score-value').textContent = `${score}%`;
      const cardActivity = canShowCounts && m.days ? `${esc(m.days)} days tracked` : esc(activity.days || 'exact counts private');
      document.getElementById('card-note').innerHTML = `primary archetype signal<br>${signature.label ? `${esc(signature.label)}<br>` : ''}${cardActivity}`;

      const summary = canShowCounts ? [
        ['commits/day', fmt(m.commitsPerDay), metricContext(m.commitsPerDay, avg.commitsPerDay)],
        ['sessions', fmt(m.sessions), metricContext(m.sessions, avg.sessions)],
        ['msgs/session', fmt(m.msgsPerSession), metricContext(m.msgsPerSession, avg.msgsPerSession)],
        ['days', fmt(m.days), metricContext(m.days, avg.days)],
      ] : [
        ['activity', activity.days || 'private', 'coarse visitor view'],
        ['cadence', activity.cadence || 'private', 'exact count hidden'],
        ['history', activity.depth || 'private', 'exact count hidden'],
        ['privacy', 'counts hidden', 'owner can opt in'],
      ];
      if (canShowLanguages) {
        const languages = m.codeLangCount ?? m.languages;
        summary.splice(Math.min(2, summary.length), 0, ['languages', fmt(languages), metricContext(languages, avg.languages)]);
      }
      if (matchInterest) {
        summary.unshift(['match interest', matchInterestText(matchInterest), matchInterestDetail(matchInterest)]);
      }
      document.getElementById('summary-grid').innerHTML = summary.map(([label, value, context]) => `
        <div class="metric">
          <div class="metric-value">${esc(value)}</div>
          <div class="metric-label">${esc(label)}</div>
          <div class="metric-context">${esc(context || '')}</div>
        </div>
      `).join('');

      renderBehavioralMoments(latest);
      renderAchievements(profile);
      renderFacetRadar(latest);
      renderFacetSignals(latest);
      renderRevealPanel(me, profile, latest);
      renderSparkline(profile.uploads, latest.archetype, arch.color, { historyVisible });
      renderTimeline(profile.uploads, arch.color, { historyVisible });
      renderViralActions(me, profile, latest);

      document.getElementById('loading').style.display = 'none';
      document.getElementById('profile').style.display = 'block';
    }

    renderProfile().catch((err) => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'grid';
      document.getElementById('error').innerHTML = `<strong>Profile failed</strong><span>${esc(err.message)}</span>`;
    });
  </script>
</body>
</html>
