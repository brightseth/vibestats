  </style>

      // Cross-type pairings (alphabetical key order)

      'architect:shipper': { name: 'Plan vs Ship', dynamic: 'The eternal productive tension. "Is it ready?" "I already pushed." One ensures quality. The other ensures delivery.', chemistry: 3, vibe: 'Healthy tension' },
      'architect:sprinter': { name: 'Speed & Strategy', dynamic: 'Move fast with a map. Plans execute at lightspeed. The architect prevents the sprinter from running off a cliff.', chemistry: 4, vibe: 'Guided velocity' },
      'builder:debugger': { name: 'Create & Break', dynamic: 'Build, break, fix, repeat. The eternal cycle of all software. One makes things, the other makes sure they work.', chemistry: 3, vibe: 'The software cycle' },
      'builder:deepdiver': { name: 'The Craftsman', dynamic: 'Deep, deliberate creation. Things get built to last. No shortcuts, no hacks. Just solid, beautiful work.', chemistry: 5, vibe: 'Quality craftsmanship' },
      'builder:orchestrator': { name: 'The Forge', dynamic: 'Parallel creation streams at full capacity. One coordinates, the other creates. Maximum output, minimum waste.', chemistry: 4, vibe: 'Scaled creation' },
      'builder:polyglot': { name: 'Universal Creator', dynamic: 'Building things in every language imaginable. No tool is off-limits. The repo has more file extensions than most companies.', chemistry: 4, vibe: 'Boundless creation' },
      'builder:shipper': { name: 'Feature Factory', dynamic: 'One creates, both ship. The backlog doesn\'t stand a chance. Features go from idea to production at an alarming rate.', chemistry: 5, vibe: 'Pure production' },
      'builder:sprinter': { name: 'Rapid Prototyper', dynamic: 'Ideas become code before the coffee cools. Speed meets creation. The prototype is done before the meeting ends.', chemistry: 4, vibe: 'Instant creation' },
      'debugger:deepdiver': { name: 'Forensic Analysis', dynamic: 'When they investigate, they find EVERYTHING. Deep focus meets systematic search. The root cause doesn\'t stand a chance.', chemistry: 5, vibe: 'Total investigation' },

    function getCompatKey(a, b) {
      return [a, b].sort().join(':');
    }

    function getCompat(a, b) {
      const key = getCompatKey(a, b);
      return COMPAT[key] || { name: 'Unknown Pairing', dynamic: 'An unexplored combination.', chemistry: 3, vibe: 'Mysterious' };
    }

    const starSVG = `<svg class="chem-star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.27 5.82 22 7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;

    function renderStars(n) {
      let html = '';
      for (let i = 0; i < 5; i++) html += i < n ? starSVG : starEmptySVG;
      return html;
    }

    // Parse URL params
    const params = new URLSearchParams(window.location.search);
    const meType = params.get('me') || params.get('a');
    const themType = params.get('b');

    // If both types present, show result directly
    if (meType && themType && ARCHETYPES[meType] && ARCHETYPES[themType]) {
      showResult(meType, themType);
    } else if (meType && ARCHETYPES[meType]) {
      showPicker(meType);
    } else {
      showPicker(null);
    }

    function showPicker(myType) {
      const picker = document.getElementById('picker');
      const youSection = document.getElementById('you-section');
      const grid = document.getElementById('archetype-grid');
      const title = document.getElementById('picker-title');
      const subtitle = document.getElementById('picker-subtitle');
      const pickLabel = document.getElementById('pick-label');

      if (myType && ARCHETYPES[myType]) {
        const a = ARCHETYPES[myType];
        title.textContent = 'Compare with a friend';
        subtitle.textContent = 'Pick their archetype to see your chemistry.';
        youSection.innerHTML = `
          <div class="you-label">You are</div>
          <div class="you-badge" style="background:${a.gradient};-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;border-color:${a.color}40">${a.name}</div>
        `;
        pickLabel.textContent = 'Your friend is...';
      } else {
        title.textContent = 'Compare two archetypes';
        subtitle.textContent = 'Pick two vibecoding personalities to see their chemistry.';
        youSection.innerHTML = '';
        pickLabel.textContent = 'Pick the first archetype';
      }

      grid.innerHTML = '';
      for (const [key, a] of Object.entries(ARCHETYPES)) {
        const card = document.createElement('a');
        card.className = 'arch-pick';
        card.href = '#';
        card.innerHTML = `
          <div class="arch-pick-name" style="background:${a.gradient};-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">${a.short}</div>
          <div class="arch-pick-tag">${a.strength}</div>
        `;
        card.addEventListener('click', (e) => {
          e.preventDefault();
          if (myType) {
            const url = new URL(window.location);
            url.searchParams.set('a', myType);
            url.searchParams.set('b', key);
            url.searchParams.delete('me');
            window.history.pushState({}, '', url);
            showResult(myType, key);
          } else {
            // First pick — now show picker for second
            const url = new URL(window.location);
            url.searchParams.set('me', key);
            window.history.pushState({}, '', url);
            showPicker(key);
          }
        });
        grid.appendChild(card);
      }
    }

    function showResult(aType, bType) {
      document.getElementById('picker').style.display = 'none';
      const result = document.getElementById('result');
      result.classList.add('visible');

      const a = ARCHETYPES[aType];
      const b = ARCHETYPES[bType];
      const compat = getCompat(aType, bType);

      // Pair types
      document.getElementById('pair-vs').innerHTML = `
        <span class="pair-type" style="background:${a.gradient};-webkit-background-clip:text;background-clip:text">${a.name}</span>
        <span class="pair-x">&times;</span>
        <span class="pair-type" style="background:${b.gradient};-webkit-background-clip:text;background-clip:text">${b.name}</span>
      `;

      document.getElementById('pair-name').textContent = compat.name;
      document.getElementById('pair-chemistry').innerHTML = renderStars(compat.chemistry) + `<span class="chem-label">${compat.chemistry}/5 chemistry</span>`;
      document.getElementById('pair-dynamic').textContent = compat.dynamic;

      document.getElementById('pair-traits').innerHTML = `
        <div class="pair-trait">
          <div class="pair-trait-label">${a.short} brings</div>
          <div class="pair-trait-val">${a.strength}</div>
        </div>
        <div class="pair-trait">
          <div class="pair-trait-label">${b.short} brings</div>
          <div class="pair-trait-val">${b.strength}</div>
        </div>
        <div class="pair-trait">
          <div class="pair-trait-label">${a.short}'s style</div>
          <div class="pair-trait-val">${a.style}</div>
        </div>
        <div class="pair-trait">
          <div class="pair-trait-label">${b.short}'s style</div>
          <div class="pair-trait-val">${b.style}</div>
        </div>
      `;

      // Update page title and og
      document.title = `${a.name} + ${b.name} = ${compat.name} | vibestats`;

      // Share URL
      const shareUrl = `https://vibestats.io/compare?a=${aType}&b=${bType}`;
      const tweetText = `${a.name} + ${b.name} = "${compat.name}"\n\n${compat.vibe}. ${compat.chemistry}/5 chemistry.\n\nCompare your vibecoding personality:\n${shareUrl}\n\n#vibestats #vibecoding`;

      document.getElementById('result-actions').innerHTML = `
        <a class="action-btn action-btn-x" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(tweetText)}" target="_blank" rel="noopener">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          Share
        </a>
        <button class="action-btn action-btn-copy" onclick="navigator.clipboard.writeText('${shareUrl}').then(()=>{this.textContent='Copied!';setTimeout(()=>this.textContent='Copy link',2000)})">
          Copy link
        </button>
        <a class="action-btn action-btn-cta" href="/" style="text-decoration:none">
          What's YOUR archetype? &rarr;
        </a>
        <a class="action-btn action-btn-vibe" href="https://www.slashvibe.dev/join?ref=vibestats_compare&archetype=${aType}&vsid=${getAnonId()}" target="_blank" rel="noopener" onclick="trackVibeReferral('compare_pairing', '${aType}')">
          Find this pairing on /vibe &rarr;
        </a>
        <button class="action-btn action-btn-copy" onclick="tryDifferent()" style="border-color:var(--border);color:var(--text-dim)">
          Try different pair
        </button>
      `;

      // Fetch community pairing data from /vibe
      fetchCommunityPairings(aType, bType);
    }

    async function fetchCommunityPairings(aType, bType) {
      const container = document.getElementById('community-pairings');
      if (!container) return;
      try {
        const res = await fetch('https://www.slashvibe.dev/api/coding-dna');
        if (!res.ok) return;
        const data = await res.json();
        if (!data.success || !data.community) return;

        const { topPairings, total } = data.community;
        const pairKey = [aType, bType].sort().join(':');

        // Find if this specific pairing exists in live data
        const thisPair = topPairings.find(p => `${p.a}:${p.b}` === pairKey);

        let html = '<div class="community-card">';
        html += '<div class="community-card-header">Popular pairings on /vibe this week</div>';

        if (topPairings.length > 0) {
          const show = topPairings.slice(0, 3);
          for (const p of show) {
            const isThis = `${p.a}:${p.b}` === pairKey;
            html += `<div class="community-live-pair">
              <span class="community-pair-name">${p.name}${isThis ? ' <span class="community-pair-badge">your pair</span>' : ''}</span>
              <span class="community-pair-count">${p.count} active</span>
            </div>`;
          }
        } else {
          html += '<div style="font-size:12px;color:var(--text-dim);padding:8px 0">No pairing data yet — be the first!</div>';
        }

        if (thisPair) {
          html += `<div class="community-match-line"><strong>${thisPair.count}</strong> ${thisPair.name} pair${thisPair.count !== 1 ? 's' : ''} active on /vibe</div>`;
        } else if (total > 0) {
          html += `<div class="community-match-line"><strong>${total}</strong> vibecoding personalities on /vibe</div>`;
        }

        html += '</div>';
        container.innerHTML = html;
        container.classList.add('loaded');
      } catch (e) { /* graceful degradation */ }
    }

    function tryDifferent() {
      const url = new URL(window.location);
      const meType = url.searchParams.get('a');
      url.searchParams.delete('b');
      if (meType) url.searchParams.set('me', meType);
      window.history.pushState({}, '', url);
      document.getElementById('result').classList.remove('visible');
      document.getElementById('picker').style.display = '';
      const cp = document.getElementById('community-pairings');
      if (cp) { cp.innerHTML = ''; cp.classList.remove('loaded'); }
      showPicker(meType);
    }

    // /vibe funnel tracking + presence
    function getAnonId() {
      let id = localStorage.getItem('vibestats_anon_id');
      if (!id) {
        id = 'vs_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
        localStorage.setItem('vibestats_anon_id', id);
      }
      return id;
    }

    function trackVibeReferral(source, archetype) {
      fetch('https://www.slashvibe.dev/api/funnel', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          stage: 'vibestats_referral',
          anonymousId: getAnonId(),
          metadata: { archetype: archetype || null, source: source || 'vibestats_compare' }
        })
      }).catch(() => {});
    }

    (async function fetchVibePresence() {
      try {
        const res = await fetch('https://www.slashvibe.dev/api/presence');
        if (res.ok) {
          const data = await res.json();
          const count = Array.isArray(data) ? data.length : (data.online || data.count || 0);
          const el = document.getElementById('vibe-online-count');
          if (el && count > 0) el.textContent = count;
        }
      } catch (e) { /* graceful degradation */ }
    })();

    // Handle browser back/forward
    window.addEventListener('popstate', () => {
      const p = new URLSearchParams(window.location.search);
      const a = p.get('a') || p.get('me');
      const b = p.get('b');
      if (a && b && ARCHETYPES[a] && ARCHETYPES[b]) {
        showResult(a, b);
      } else {
        document.getElementById('result').classList.remove('visible');
        document.getElementById('picker').style.display = '';
        showPicker(a && ARCHETYPES[a] ? a : null);
      }
    });
  </script>
</body>
</html>
