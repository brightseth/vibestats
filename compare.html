<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Compare Vibecoding Personalities | vibestats</title>
  <meta name="description" content="Compare your vibecoding personality with a friend. See your chemistry, dynamic, and pairing name.">
  <meta property="og:title" content="Compare Vibecoding Personalities | vibestats">
  <meta property="og:description" content="See how two vibecoding archetypes work together. Chemistry, dynamics, and pairing names.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://vibestats.io/compare">
  <meta property="og:image" content="https://vibestats.io/og-card.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://vibestats.io/og-card.png">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root {
      --bg: #06060a; --surface: #0d0d14; --surface-2: #14141e; --border: #252535;
      --text: #E0E0E0; --text-muted: #8888a0; --text-dim: #555568;
      --accent: #6B8FFF; --purple: #a78bfa; --green: #22c55e; --amber: #f59e0b;
      --red: #ef4444; --pink: #ff79c6; --cyan: #22d3ee;
      --mono: 'JetBrains Mono', 'SF Mono', Monaco, Consolas, monospace;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans); background: var(--bg); color: var(--text);
      min-height: 100vh; -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 48px 24px 64px; text-align: center;
    }

    .logo {
      font-family: var(--mono); font-size: 13px; font-weight: 600;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; letter-spacing: 0.05em; margin-bottom: 32px;
      text-decoration: none;
    }

    h1 {
      font-size: clamp(24px, 6vw, 40px); font-weight: 900; color: #fff;
      letter-spacing: -0.02em; line-height: 1.2; max-width: 600px; margin-bottom: 8px;
    }
    .subtitle {
      font-size: 15px; color: var(--text-muted); max-width: 480px;
      line-height: 1.6; margin-bottom: 40px;
    }

    /* Picker grid */
    .you-label {
      font-family: var(--mono); font-size: 11px; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 16px;
    }
    .you-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 24px; border-radius: 12px; margin-bottom: 32px;
      font-family: var(--sans); font-size: 18px; font-weight: 800;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; border: 1px solid rgba(255,255,255,0.1);
    }

    .pick-label {
      font-family: var(--mono); font-size: 12px; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 20px;
    }

    .archetype-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
      width: min(440px, 90vw); margin-bottom: 40px;
    }
    .arch-pick {
      padding: 16px 12px; border-radius: 14px; cursor: pointer;
      background: var(--surface); border: 1px solid var(--border);
      transition: all 0.2s; text-align: center; text-decoration: none;
      min-height: 44px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
    }
    .arch-pick:hover { border-color: var(--accent); background: rgba(107,143,255,0.04); }
    .arch-pick-name {
      font-family: var(--sans); font-size: 13px; font-weight: 700; color: #fff;
    }
    .arch-pick-tag {
      font-family: var(--mono); font-size: 9px; color: var(--text-dim);
      letter-spacing: 0.04em;
    }

    /* Result card */
    .result { display: none; width: min(480px, 90vw); }
    .result.visible { display: block; }

    .pair-card {
      background: linear-gradient(145deg, #0d0d18, #12121f);
      border: 1px solid rgba(107,143,255,0.2); border-radius: 20px;
      padding: 32px 24px; text-align: center; position: relative; overflow: hidden;
    }
    .pair-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--purple), transparent);
    }

    .pair-vs {
      display: flex; align-items: center; justify-content: center; gap: 16px;
      margin-bottom: 20px; flex-wrap: wrap;
    }
    .pair-person {
      display: grid; justify-items: center; gap: 4px; min-width: 0;
    }
    .pair-type {
      font-size: clamp(14px, 3.5vw, 18px); font-weight: 800;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .pair-profile-meta {
      max-width: 180px; color: var(--text-dim); font-family: var(--mono);
      font-size: 10px; line-height: 1.35;
    }
    .pair-x {
      font-family: var(--mono); font-size: 14px; color: var(--text-dim);
    }

    .pair-name {
      font-size: clamp(28px, 7vw, 44px); font-weight: 900; color: #fff;
      letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 12px;
    }

    .pair-chemistry {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      margin-bottom: 16px;
    }
    .chem-star {
      width: 18px; height: 18px; color: var(--amber);
    }
    .chem-star.empty { opacity: 0.15; }
    .chem-label {
      font-family: var(--mono); font-size: 11px; color: var(--text-dim);
      margin-left: 8px; text-transform: uppercase; letter-spacing: 0.08em;
    }

    .pair-dynamic {
      font-size: 16px; color: var(--text-muted); line-height: 1.7;
      max-width: 400px; margin: 0 auto 24px;
    }

    .pair-traits {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px;
    }
    .pair-trait {
      padding: 10px; background: rgba(255,255,255,0.02);
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.04);
    }
    .pair-trait-label {
      font-family: var(--mono); font-size: 9px; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px;
    }
    .pair-trait-val {
      font-size: 13px; font-weight: 600; color: #fff;
    }

    .pair-brand {
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .result-actions {
      display: flex; gap: 10px; margin-top: 24px; justify-content: center; flex-wrap: wrap;
    }
    .action-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 20px; border-radius: 10px; font-family: var(--mono);
      font-size: 12px; text-decoration: none; cursor: pointer;
      border: none; transition: all 0.2s; font-weight: 500; min-height: 44px;
      -webkit-tap-highlight-color: transparent;
    }
    .action-btn-x { background: #fff; color: #000; }
    .action-btn-x:hover { background: #e0e0e0; }
    .action-btn-copy {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: var(--text);
    }
    .action-btn-copy:hover { border-color: var(--accent); color: var(--accent); }
    .action-btn-cta {
      background: linear-gradient(135deg, rgba(107,143,255,0.15), rgba(167,139,250,0.1));
      border: 1px solid rgba(107,143,255,0.35); color: #8aadff;
    }
    .action-btn-cta:hover { border-color: var(--accent); }

    .action-btn-vibe {
      background: linear-gradient(135deg, rgba(107,143,255,0.2), rgba(167,139,250,0.15));
      border: 1px solid rgba(107,143,255,0.5); color: #8aadff;
    }
    .action-btn-vibe:hover {
      border-color: var(--accent);
      background: linear-gradient(135deg, rgba(107,143,255,0.3), rgba(167,139,250,0.2));
      color: #fff;
    }
    .compare-status {
      min-height: 18px; margin: -24px 0 24px;
      color: var(--text-dim); font-family: var(--mono); font-size: 12px;
    }

    /* Enhanced /vibe footer */
    .vibe-footer { margin-top: 48px; width: min(400px, 90vw); }
    .vibe-footer-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px 24px; text-align: center;
    }
    .vibe-footer-logo {
      font-family: var(--mono); font-size: 16px; font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .vibe-footer-tagline { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
    .vibe-footer-presence {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--mono); font-size: 11px; color: var(--text-muted);
      margin: 12px 0;
    }
    .vibe-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--green);
      animation: dotPulse 2s ease-in-out infinite;
    }
    @keyframes dotPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .vibe-footer-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 20px; border-radius: 10px;
      background: linear-gradient(135deg, rgba(107,143,255,0.12), rgba(167,139,250,0.08));
      border: 1px solid rgba(107,143,255,0.3);
      font-family: var(--mono); font-size: 12px; font-weight: 500;
      color: #8aadff; text-decoration: none; transition: all 0.2s;
    }
    .vibe-footer-btn:hover { border-color: var(--accent); color: #fff; }

    @supports (padding: env(safe-area-inset-bottom)) {
      .page { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
    }

    @media (max-width: 480px) {
      .archetype-grid { gap: 8px; }
      .arch-pick { padding: 12px 8px; }
      .result-actions { flex-direction: column; align-items: stretch; }
      .action-btn { justify-content: center; }
      .pair-vs { gap: 10px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <a class="logo" href="/">vibestats</a>

    <!-- Picker state -->
    <div id="picker">
      <h1 id="picker-title">Compare with a friend</h1>
      <p class="subtitle" id="picker-subtitle">Pick your friend's archetype to see your chemistry.</p>
      <div class="compare-status" id="compare-status"></div>
      <div id="you-section"></div>
      <div class="pick-label" id="pick-label">Your friend is...</div>
      <div class="archetype-grid" id="archetype-grid"></div>
      <p style="font-size:13px;color:var(--text-dim);max-width:400px">
        Don't know their archetype? Send them to
        <a href="/" style="color:var(--accent);text-decoration:none">vibestats.io</a>
        to find out.
      </p>
    </div>

    <!-- Result state -->
    <div class="result" id="result">
      <div class="pair-card" id="pair-card">
        <div class="pair-vs" id="pair-vs"></div>
        <div class="pair-name" id="pair-name"></div>
        <div class="pair-chemistry" id="pair-chemistry"></div>
        <div class="pair-dynamic" id="pair-dynamic"></div>
        <div class="pair-traits" id="pair-traits"></div>
        <div class="pair-brand">vibestats.io</div>
      </div>
      <div class="result-actions" id="result-actions"></div>
    </div>

    <div class="vibe-footer">
      <div class="vibe-footer-card">
        <div class="vibe-footer-logo">/vibe</div>
        <div class="vibe-footer-tagline">The social network for Claude Code</div>
        <div class="vibe-footer-presence">
          <span class="vibe-dot"></span>
          <span id="vibe-online-count">&mdash;</span> online now
        </div>
        <br>
        <a class="vibe-footer-btn" href="https://www.slashvibe.dev/join?ref=vibestats_compare" target="_blank" rel="noopener" onclick="trackVibeReferral('compare_footer')">
          Join /vibe &rarr;
        </a>
      </div>
    </div>
  </div>

  <script src="/lib/compat.js"></script>
  <script>
    const ARCHETYPES = {
      orchestrator: { name: 'THE ORCHESTRATOR', short: 'Orchestrator', gradient: 'linear-gradient(135deg, #6B8FFF, #a78bfa)', color: '#6B8FFF', strength: 'Parallel execution', style: 'Conductor' },
      shipper: { name: 'THE SHIPPER', short: 'Shipper', gradient: 'linear-gradient(135deg, #22c55e, #22d3ee)', color: '#22c55e', strength: 'Ship velocity', style: 'Deployer' },
      architect: { name: 'THE ARCHITECT', short: 'Architect', gradient: 'linear-gradient(135deg, #6B8FFF, #3b82f6)', color: '#6B8FFF', strength: 'System design', style: 'Planner' },
      debugger: { name: 'THE DEBUGGER', short: 'Debugger', gradient: 'linear-gradient(135deg, #f59e0b, #ef4444)', color: '#f59e0b', strength: 'Investigation', style: 'Detective' },
      polyglot: { name: 'THE POLYGLOT', short: 'Polyglot', gradient: 'linear-gradient(135deg, #ff79c6, #f59e0b)', color: '#ff79c6', strength: 'Versatility', style: 'Multilingual' },
      sprinter: { name: 'THE SPRINTER', short: 'Sprinter', gradient: 'linear-gradient(135deg, #ef4444, #ff79c6)', color: '#ef4444', strength: 'Raw speed', style: 'Rapid-fire' },
      deepdiver: { name: 'THE DEEP DIVER', short: 'Deep Diver', gradient: 'linear-gradient(135deg, #3b82f6, #1e40af)', color: '#3b82f6', strength: 'Deep focus', style: 'Immersive' },
      builder: { name: 'THE BUILDER', short: 'Builder', gradient: 'linear-gradient(135deg, #22c55e, #16a34a)', color: '#22c55e', strength: 'Creation', style: 'Maker' },
    };

    function getCompat(a, b) {
      return window.VibeCompat.getPairing(a, b);
    }

    const starSVG = `<svg class="chem-star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.27 5.82 22 7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
    const starEmptySVG = `<svg class="chem-star empty" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.27 5.82 22 7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
    const HANDLE_RE = /^[a-zA-Z0-9-]{1,39}$/;
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    let currentComparison = null;

    function renderStars(n) {
      let html = '';
      for (let i = 0; i < 5; i++) html += i < n ? starSVG : starEmptySVG;
      return html;
    }

    routeCompare();

    function setStatus(message) {
      const el = document.getElementById('compare-status');
      if (el) el.textContent = message || '';
    }

    function subjectParam(subject) {
      return subject?.param || subject?.handle || subject?.type || '';
    }

    function normalizeSubject(subject) {
      if (!subject) return null;
      if (typeof subject === 'string') return ARCHETYPES[subject] ? { type: subject, param: subject } : null;
      if (!ARCHETYPES[subject.type]) return null;
      return { ...subject, param: subjectParam(subject) };
    }

    function subjectLabel(subject) {
      return subject.handle ? `@${subject.handle}` : ARCHETYPES[subject.type].name;
    }

    function subjectMeta(subject) {
      if (!subject.handle) return '';
      return subject.signature || ARCHETYPES[subject.type].name;
    }

    async function resolveCompareSubject(value) {
      const raw = String(value || '').trim().replace(/^@/, '');
      if (!raw) return null;
      if (ARCHETYPES[raw]) return { type: raw, param: raw };
      if (!HANDLE_RE.test(raw)) return null;

      try {
        const res = await fetch(`/api/u/${encodeURIComponent(raw)}`);
        if (!res.ok) return null;
        const profile = await res.json();
        const latest = profile.uploads?.[0];
        if (!latest?.archetype || !ARCHETYPES[latest.archetype]) return null;
        return {
          type: latest.archetype,
          handle: profile.user.gh_handle,
          signature: latest.raw_meta?.signature || '',
          param: profile.user.gh_handle,
        };
      } catch {
        return null;
      }
    }

    async function routeCompare() {
      const params = new URLSearchParams(window.location.search);
      const aParam = params.get('a');
      const bParam = params.get('b');
      const meParam = params.get('me') || aParam;

      if (aParam && bParam) {
        setStatus('Resolving profiles...');
        const [aSubject, bSubject] = await Promise.all([
          resolveCompareSubject(aParam),
          resolveCompareSubject(bParam),
        ]);
        if (aSubject && bSubject) {
          setStatus('');
          showResult(aSubject, bSubject);
          return;
        }
        setStatus('Could not load one profile. Pick archetypes instead.');
        showPicker(null);
        return;
      }

      if (meParam) {
        setStatus(ARCHETYPES[meParam] ? '' : 'Resolving profile...');
        const subject = await resolveCompareSubject(meParam);
        setStatus(subject ? '' : (meParam ? 'Could not load that profile. Pick an archetype instead.' : ''));
        showPicker(subject);
        return;
      }

      setStatus('');
      showPicker(null);
    }

    function showPicker(mySubject) {
      const subject = normalizeSubject(mySubject);
      const myType = subject?.type || null;
      const picker = document.getElementById('picker');
      const youSection = document.getElementById('you-section');
      const grid = document.getElementById('archetype-grid');
      const title = document.getElementById('picker-title');
      const subtitle = document.getElementById('picker-subtitle');
      const pickLabel = document.getElementById('pick-label');

      if (myType && ARCHETYPES[myType]) {
        const a = ARCHETYPES[myType];
        title.textContent = 'Compare with a friend';
        subtitle.textContent = 'Pick their archetype to see your chemistry.';
        youSection.innerHTML = `
          <div class="you-label">${subject.handle ? 'Profile' : 'You are'}</div>
          <div class="you-badge" style="background:${a.gradient};-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;border-color:${a.color}40">${esc(subjectLabel(subject))}</div>
          ${subjectMeta(subject) ? `<div style="font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-top:-22px;margin-bottom:24px">${esc(subjectMeta(subject))}</div>` : ''}
        `;
        pickLabel.textContent = 'Your friend is...';
      } else {
        title.textContent = 'Compare two archetypes';
        subtitle.textContent = 'Pick two vibecoding personalities to see their chemistry.';
        youSection.innerHTML = '';
        pickLabel.textContent = 'Pick the first archetype';
      }

      grid.innerHTML = '';
      for (const [key, a] of Object.entries(ARCHETYPES)) {
        const card = document.createElement('a');
        card.className = 'arch-pick';
        card.href = '#';
        card.innerHTML = `
          <div class="arch-pick-name" style="background:${a.gradient};-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">${a.short}</div>
          <div class="arch-pick-tag">${a.strength}</div>
        `;
        card.addEventListener('click', (e) => {
          e.preventDefault();
          if (myType) {
            const url = new URL(window.location);
            url.searchParams.set('a', subjectParam(subject));
            url.searchParams.set('b', key);
            url.searchParams.delete('me');
            window.history.pushState({}, '', url);
            showResult(subject, { type: key, param: key });
          } else {
            // First pick — now show picker for second
            const url = new URL(window.location);
            url.searchParams.set('me', key);
            window.history.pushState({}, '', url);
            showPicker({ type: key, param: key });
          }
        });
        grid.appendChild(card);
      }
    }

    function pairPersonHtml(subject) {
      const a = ARCHETYPES[subject.type];
      const meta = subjectMeta(subject);
      return `
        <span class="pair-person">
          <span class="pair-type" style="background:${a.gradient};-webkit-background-clip:text;background-clip:text">${esc(subjectLabel(subject))}</span>
          ${meta ? `<span class="pair-profile-meta">${esc(meta)}</span>` : ''}
        </span>
      `;
    }

    function traitLabel(subject) {
      return subject.handle ? `@${subject.handle}` : ARCHETYPES[subject.type].short;
    }

    function canonicalShareUrl(aSubject, bSubject) {
      if (aSubject.handle && bSubject.handle) {
        return `https://vibestats.io/u/${encodeURIComponent(bSubject.handle)}/pair/${encodeURIComponent(aSubject.handle)}`;
      }
      return `https://vibestats.io/compare?a=${encodeURIComponent(subjectParam(aSubject))}&b=${encodeURIComponent(subjectParam(bSubject))}`;
    }

    function showResult(aSubjectInput, bSubjectInput) {
      const aSubject = normalizeSubject(aSubjectInput);
      const bSubject = normalizeSubject(bSubjectInput);
      if (!aSubject || !bSubject) {
        showPicker(null);
        return;
      }
      currentComparison = { a: aSubject, b: bSubject };
      document.getElementById('picker').style.display = 'none';
      const result = document.getElementById('result');
      result.classList.add('visible');

      const aType = aSubject.type;
      const bType = bSubject.type;
      const a = ARCHETYPES[aType];
      const b = ARCHETYPES[bType];
      const compat = getCompat(aType, bType);

      // Pair types
      document.getElementById('pair-vs').innerHTML = `
        ${pairPersonHtml(aSubject)}
        <span class="pair-x">&times;</span>
        ${pairPersonHtml(bSubject)}
      `;

      document.getElementById('pair-name').textContent = compat.name;
      document.getElementById('pair-chemistry').innerHTML = renderStars(compat.chemistry) + `<span class="chem-label">${compat.chemistry}/5 chemistry</span>`;
      document.getElementById('pair-dynamic').textContent = compat.dynamic;

      document.getElementById('pair-traits').innerHTML = `
        <div class="pair-trait">
          <div class="pair-trait-label">${esc(traitLabel(aSubject))} brings</div>
          <div class="pair-trait-val">${a.strength}</div>
        </div>
        <div class="pair-trait">
          <div class="pair-trait-label">${esc(traitLabel(bSubject))} brings</div>
          <div class="pair-trait-val">${b.strength}</div>
        </div>
        <div class="pair-trait">
          <div class="pair-trait-label">${esc(traitLabel(aSubject))}'s style</div>
          <div class="pair-trait-val">${a.style}</div>
        </div>
        <div class="pair-trait">
          <div class="pair-trait-label">${esc(traitLabel(bSubject))}'s style</div>
          <div class="pair-trait-val">${b.style}</div>
        </div>
      `;

      // Update page title and og
      document.title = `${subjectLabel(aSubject)} + ${subjectLabel(bSubject)} = ${compat.name} | vibestats`;

      // Share URL
      const shareUrl = canonicalShareUrl(aSubject, bSubject);
      const tweetText = `${subjectLabel(aSubject)} (${a.short}) + ${subjectLabel(bSubject)} (${b.short}) = "${compat.name}"\n\n${compat.vibe}. ${compat.chemistry}/5 chemistry.\n\nCompare your vibecoding personality:\n${shareUrl}\n\n#vibestats #vibecoding`;

      document.getElementById('result-actions').innerHTML = `
        <a class="action-btn action-btn-x" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(tweetText)}" target="_blank" rel="noopener">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          Share
        </a>
        <button class="action-btn action-btn-copy" onclick="navigator.clipboard.writeText('${shareUrl}').then(()=>{this.textContent='Copied!';setTimeout(()=>this.textContent='Copy link',2000)})">
          Copy link
        </button>
        <a class="action-btn action-btn-cta" href="/" style="text-decoration:none">
          What's YOUR archetype? &rarr;
        </a>
        <a class="action-btn action-btn-vibe" href="https://www.slashvibe.dev/join?ref=vibestats_compare&archetype=${aType}&vsid=${getAnonId()}" target="_blank" rel="noopener" onclick="trackVibeReferral('compare_pairing', '${aType}')">
          Find this pairing on /vibe &rarr;
        </a>
        <button class="action-btn action-btn-copy" onclick="tryDifferent()" style="border-color:var(--border);color:var(--text-dim)">
          Try different pair
        </button>
      `;

      // Fetch live pairing data from /vibe
      fetchPairingData(aType, bType, compat);
    }

    async function fetchPairingData(aType, bType, compat) {
      const container = document.createElement('div');
      container.id = 'vibe-pairings';
      container.style.cssText = 'margin-top:24px;width:min(480px,90vw);opacity:0;transition:opacity 0.5s';
      document.getElementById('result').appendChild(container);

      try {
        const res = await fetch('https://www.slashvibe.dev/api/coding-dna');
        if (!res.ok) return;
        const data = await res.json();
        if (!data.community) return;

        const myKey = [aType, bType].sort().join(':');
        const pairings = (data.community.topPairings || []).slice(0, 3);

        let html = '<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 24px;text-align:center">';
        html += '<div style="font-family:var(--mono);font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.15em;margin-bottom:12px">Popular pairings on /vibe</div>';

        if (pairings.length > 0) {
          pairings.forEach(p => {
            const isYours = [p.a, p.b].sort().join(':') === myKey;
            html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;${isYours ? 'color:var(--accent)' : 'color:var(--text-muted)'}">
              <span style="font-family:var(--mono);font-size:12px">${p.name}${isYours ? ' (you!)' : ''}</span>
              <span style="font-family:var(--mono);font-size:11px;color:var(--text-dim)">${p.count} pairs</span>
            </div>`;
          });
        }

        if (data.community.total > 0) {
          html += `<div style="font-family:var(--mono);font-size:10px;color:var(--text-dim);margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">${data.community.total} vibecoders with archetypes on /vibe</div>`;
        }
        html += '</div>';

        container.innerHTML = html;
        requestAnimationFrame(() => container.style.opacity = '1');
      } catch (e) { /* graceful degradation */ }
    }

    function tryDifferent() {
      const vp = document.getElementById('vibe-pairings');
      if (vp) vp.remove();
      const url = new URL(window.location);
      const seed = currentComparison?.a || null;
      url.searchParams.delete('b');
      if (seed) url.searchParams.set('me', subjectParam(seed));
      window.history.pushState({}, '', url);
      document.getElementById('result').classList.remove('visible');
      document.getElementById('picker').style.display = '';
      showPicker(seed);
    }

    // /vibe funnel tracking + presence
    function getAnonId() {
      let id = localStorage.getItem('vibestats_anon_id');
      if (!id) {
        id = 'vs_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
        localStorage.setItem('vibestats_anon_id', id);
      }
      return id;
    }

    function trackVibeReferral(source, archetype) {
      fetch('https://www.slashvibe.dev/api/funnel', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          stage: 'vibestats_referral',
          anonymousId: getAnonId(),
          metadata: { archetype: archetype || null, source: source || 'vibestats_compare' }
        })
      }).catch(() => {});
    }

    (async function fetchVibePresence() {
      try {
        const res = await fetch('https://www.slashvibe.dev/api/presence');
        if (res.ok) {
          const data = await res.json();
          const count = Array.isArray(data) ? data.length : (data.online || data.count || 0);
          const el = document.getElementById('vibe-online-count');
          if (el && count > 0) el.textContent = count;
        }
      } catch (e) { /* graceful degradation */ }
    })();

    // Handle browser back/forward
    window.addEventListener('popstate', () => {
      const vp = document.getElementById('vibe-pairings');
      if (vp) vp.remove();
      document.getElementById('result').classList.remove('visible');
      document.getElementById('picker').style.display = '';
      routeCompare();
    });
  </script>
</body>
</html>
