<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>vibestats leaderboard</title>
  <meta name="description" content="Public vibestats archetype leaderboards for Claude Code users.">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root {
      --bg: #06060a;
      --surface: #0d0d14;
      --surface-2: #14141e;
      --border: #252535;
      --text: #e0e0e0;
      --text-muted: #8888a0;
      --text-dim: #555568;
      --accent: #6B8FFF;
      --accent-2: #a78bfa;
      --mono: 'JetBrains Mono', 'SF Mono', Monaco, Consolas, monospace;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .shell {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 56px;
    }
    .topbar, .hero, .entry, .entry-main, .tabs, .stats {
      display: flex;
      align-items: center;
    }
    .topbar {
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 44px;
    }
    .brand {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .btn:hover, .btn.active { border-color: var(--accent); color: #fff; }
    .btn.primary {
      border-color: rgba(107,143,255,0.45);
      background: linear-gradient(135deg, rgba(107,143,255,0.18), rgba(167,139,250,0.12));
      color: #c8d5ff;
    }
    .hero {
      justify-content: space-between;
      gap: 28px;
      margin-bottom: 26px;
    }
    .eyebrow, .meta, .tab, .rank, .score-label, .empty {
      font-family: var(--mono);
      letter-spacing: 0;
    }
    .eyebrow {
      margin-bottom: 10px;
      color: var(--text-dim);
      font-size: 12px;
      text-transform: uppercase;
    }
    h1 {
      color: #fff;
      font-size: 48px;
      line-height: 1;
      letter-spacing: 0;
    }
    .lead {
      max-width: 640px;
      margin-top: 14px;
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.6;
    }
    .hero-stat {
      min-width: 220px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(107,143,255,0.1), rgba(255,255,255,0.03));
      padding: 18px;
    }
    .hero-stat strong {
      display: block;
      color: #fff;
      font-size: 36px;
      line-height: 1;
    }
    .hero-stat span {
      display: block;
      margin-top: 8px;
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 12px;
    }
    .tabs {
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .tab {
      min-height: 36px;
      padding: 8px 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      text-decoration: none;
      text-transform: uppercase;
    }
    .tab.active {
      border-color: var(--accent);
      background: rgba(107,143,255,0.1);
      color: #fff;
    }
    .list {
      display: grid;
      gap: 10px;
    }
    .entry {
      justify-content: space-between;
      gap: 18px;
      min-height: 86px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      background: var(--surface);
    }
    .entry-main {
      min-width: 0;
      gap: 13px;
    }
    .rank {
      flex: 0 0 42px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 800;
    }
    .avatar {
      flex: 0 0 auto;
      width: 48px;
      height: 48px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      background: var(--surface-2);
      object-fit: cover;
    }
    .identity {
      min-width: 0;
    }
    .handle {
      display: inline-block;
      max-width: 260px;
      overflow: hidden;
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      text-decoration: none;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .handle:hover { color: #c8d5ff; }
    .signature, .meta {
      margin-top: 5px;
      color: var(--text-dim);
      font-size: 12px;
      line-height: 1.4;
    }
    .signature {
      color: #c8d5ff;
      font-family: var(--mono);
    }
    .stats {
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }
    .score {
      min-width: 86px;
      padding: 10px;
      border: 1px solid rgba(107,143,255,0.2);
      border-radius: 8px;
      background: rgba(107,143,255,0.08);
      text-align: right;
    }
    .score strong {
      display: block;
      color: #fff;
      font-family: var(--mono);
      font-size: 24px;
      line-height: 1;
    }
    .score-label {
      display: block;
      margin-top: 6px;
      color: var(--text-dim);
      font-size: 10px;
      text-transform: uppercase;
    }
    .metric {
      min-width: 80px;
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 11px;
      text-align: right;
    }
    .metric strong {
      display: block;
      color: #fff;
      font-family: var(--sans);
      font-size: 13px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }
    .empty {
      min-height: 280px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text-muted);
      text-align: center;
      line-height: 1.7;
    }
    @media (max-width: 760px) {
      .topbar, .hero, .entry {
        align-items: stretch;
        flex-direction: column;
      }
      h1 { font-size: 36px; }
      .hero-stat { min-width: 0; }
      .stats { justify-content: flex-start; }
      .score, .metric { text-align: left; }
    }
    @media (max-width: 520px) {
      .nav { flex-direction: column; align-items: stretch; width: 100%; }
      .btn { width: 100%; }
      .tabs { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
      .tab { flex: 0 0 auto; }
      .entry-main { align-items: flex-start; }
      .rank { flex-basis: 28px; }
      .avatar { width: 42px; height: 42px; }
      .metric { min-width: 70px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topbar">
      <a class="brand" href="/">vibestats</a>
      <div class="nav">
        <a class="btn" href="/">Upload</a>
        <a class="btn" href="/browse">Browse</a>
        <a class="btn primary" href="/genome">Genome</a>
      </div>
    </nav>

    <section class="hero">
      <div>
        <div class="eyebrow">public leaderboard</div>
        <h1 id="title">Builder leaderboard</h1>
        <p class="lead" id="lead">Ranked public profiles by this week's latest saved archetype signal. Unlisted and private profiles are not included.</p>
      </div>
      <div class="hero-stat">
        <strong id="total">-</strong>
        <span id="total-label">public profiles this week</span>
      </div>
    </section>

    <nav class="tabs" id="tabs" aria-label="Archetype leaderboards"></nav>
    <section class="list" id="list">
      <div class="empty">Loading leaderboard...</div>
    </section>
  </main>

  <script>
    const ARCHETYPES = {
      orchestrator: { name: 'Orchestrator', color: '#6B8FFF' },
      shipper: { name: 'Shipper', color: '#22c55e' },
      architect: { name: 'Architect', color: '#3b82f6' },
      debugger: { name: 'Debugger', color: '#f59e0b' },
      polyglot: { name: 'Polyglot', color: '#ff79c6' },
      sprinter: { name: 'Sprinter', color: '#ef4444' },
      deepdiver: { name: 'Deep Diver', color: '#3b82f6' },
      builder: { name: 'Builder', color: '#22c55e' },
    };

    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = (value) => {
      const n = Number(value || 0);
      if (!Number.isFinite(n)) return '-';
      if (n >= 1000) return Math.round(n).toLocaleString();
      return n % 1 === 0 ? String(n) : n.toFixed(1);
    };

    function archetypeFromLocation() {
      const query = new URLSearchParams(location.search).get('archetype');
      if (query && ARCHETYPES[query]) return query;
      const parts = location.pathname.split('/').filter(Boolean);
      const last = parts[parts.length - 1];
      return ARCHETYPES[last] ? last : 'builder';
    }

    function renderTabs(active) {
      document.getElementById('tabs').innerHTML = Object.entries(ARCHETYPES).map(([key, arch]) => `
        <a class="tab ${key === active ? 'active' : ''}" href="/leaderboard/${key}">${esc(arch.name)}</a>
      `).join('');
    }

    function renderEntries(entries) {
      const list = document.getElementById('list');
      if (!entries.length) {
        list.innerHTML = '<div class="empty">No public profiles in this archetype yet.<br>Set your profile to public from Settings to join the board.</div>';
        return;
      }

      list.innerHTML = entries.map((entry) => {
        const handle = entry.user?.gh_handle || 'unknown';
        const activity = entry.activity || {};
        const avatar = entry.user?.avatar_url
          ? `<img class="avatar" src="${esc(entry.user.avatar_url)}" alt="@${esc(handle)}">`
          : '<div class="avatar" aria-hidden="true"></div>';
        return `
          <article class="entry">
            <div class="entry-main">
              <div class="rank">#${esc(entry.rank)}</div>
              ${avatar}
              <div class="identity">
                <a class="handle" href="/u/${encodeURIComponent(handle)}">@${esc(handle)}</a>
                <div class="signature">${esc(entry.signature?.label || ARCHETYPES[entry.archetype]?.name || entry.archetype)}</div>
                <div class="meta">${esc(activity.days || 'fresh profile')}</div>
              </div>
            </div>
            <div class="stats">
              <div class="score"><strong>${esc(entry.score)}%</strong><span class="score-label">signal</span></div>
              <div class="metric"><strong>${esc(activity.cadence || 'private')}</strong>cadence</div>
              <div class="metric"><strong>${esc(activity.depth || 'private')}</strong>history</div>
            </div>
          </article>
        `;
      }).join('');
    }

    async function renderLeaderboard() {
      const archetype = archetypeFromLocation();
      const arch = ARCHETYPES[archetype] || ARCHETYPES.builder;
      document.documentElement.style.setProperty('--accent', arch.color);
      document.title = `${arch.name} leaderboard | vibestats`;
      document.getElementById('title').textContent = `${arch.name} leaderboard`;
      renderTabs(archetype);

      try {
        const res = await fetch(`/api/leaderboard?archetype=${encodeURIComponent(archetype)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Leaderboard unavailable');
        document.getElementById('total').textContent = fmt(data.total);
        document.getElementById('total-label').textContent = data.unavailable ? 'database unavailable' : 'public profiles this week';
        renderEntries(data.entries || []);
      } catch (err) {
        document.getElementById('list').innerHTML = `<div class="empty">Leaderboard unavailable.<br>${esc(err.message)}</div>`;
      }
    }

    renderLeaderboard();
  </script>
</body>
</html>
