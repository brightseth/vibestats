<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Match | vibestats</title>
  <meta name="description" content="Find Claude Code collaborators by goal and vibecoding profile.">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root {
      --bg: #06060a;
      --surface: #0d0d14;
      --surface-2: #14141e;
      --border: #252535;
      --text: #e0e0e0;
      --text-muted: #8888a0;
      --text-dim: #555568;
      --accent: #6B8FFF;
      --purple: #a78bfa;
      --mono: 'JetBrains Mono', 'SF Mono', Monaco, Consolas, monospace;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .shell {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 56px;
    }
    .topbar, .hero, .goals, .entry, .entry-main, .stats, .actions {
      display: flex;
      align-items: center;
    }
    .topbar {
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 44px;
    }
    .brand {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav, .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .btn, .goal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:hover, .goal:hover, .goal.active { border-color: var(--accent); color: #fff; }
    .btn.primary {
      border-color: rgba(107,143,255,0.45);
      background: linear-gradient(135deg, rgba(107,143,255,0.18), rgba(167,139,250,0.12));
      color: #c8d5ff;
    }
    .hero {
      justify-content: space-between;
      gap: 28px;
      margin-bottom: 24px;
    }
    .hero > div {
      min-width: 0;
      width: 100%;
    }
    .eyebrow, .lead, .selector-label, .goal, .intent, .meta, .score-label, .empty, .fit, .fit-reason {
      font-family: var(--mono);
      letter-spacing: 0;
    }
    .eyebrow {
      margin-bottom: 10px;
      color: var(--text-dim);
      font-size: 12px;
      text-transform: uppercase;
    }
    h1 {
      max-width: 100%;
      color: #fff;
      font-size: 48px;
      line-height: 1;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }
    .lead {
      max-width: min(680px, 100%);
      margin-top: 14px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
      overflow-wrap: break-word;
    }
    .selector-group {
      margin-bottom: 16px;
    }
    .selector-label {
      margin-bottom: 8px;
      color: var(--text-dim);
      font-size: 11px;
      text-transform: uppercase;
    }
    .goals {
      gap: 8px;
      flex-wrap: wrap;
    }
    .goal {
      min-height: 36px;
      padding: 8px 11px;
      border-radius: 999px;
      background: transparent;
      font-size: 11px;
      text-transform: uppercase;
    }
    .goal.active {
      background: rgba(107,143,255,0.1);
      color: #fff;
    }
    .list { display: grid; gap: 10px; }
    .entry {
      justify-content: space-between;
      gap: 18px;
      min-height: 96px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      background: var(--surface);
    }
    .entry-main {
      min-width: 0;
      gap: 13px;
    }
    .avatar {
      flex: 0 0 auto;
      width: 52px;
      height: 52px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 13px;
      background: var(--surface-2);
      object-fit: cover;
    }
    .identity { min-width: 0; }
    .handle {
      display: inline-block;
      max-width: 260px;
      overflow: hidden;
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      text-decoration: none;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .signature, .meta {
      margin-top: 5px;
      color: var(--text-dim);
      font-size: 12px;
      line-height: 1.4;
    }
    .signature {
      color: #c8d5ff;
      font-family: var(--mono);
    }
    .intent {
      display: inline-flex;
      margin-top: 7px;
      padding: 5px 9px;
      border: 1px solid rgba(107,143,255,0.25);
      border-radius: 999px;
      background: rgba(107,143,255,0.08);
      color: #c8d5ff;
      font-size: 11px;
    }
    .stats {
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }
    .fit {
      min-width: 88px;
      padding: 10px;
      border: 1px solid rgba(107,143,255,0.2);
      border-radius: 8px;
      background: rgba(107,143,255,0.08);
      text-align: right;
    }
    .fit.strong { border-color: rgba(34,197,94,0.34); background: rgba(34,197,94,0.08); }
    .fit.good { border-color: rgba(107,143,255,0.3); }
    .fit strong {
      display: block;
      color: #fff;
      font-size: 24px;
      line-height: 1;
    }
    .score-label {
      display: block;
      margin-top: 6px;
      color: var(--text-dim);
      font-size: 10px;
      text-transform: uppercase;
    }
    .fit-reason {
      max-width: 230px;
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.45;
      text-align: right;
    }
    .metric {
      min-width: 80px;
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 11px;
      text-align: right;
    }
    .metric strong {
      display: block;
      color: #fff;
      font-family: var(--sans);
      font-size: 13px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }
    .empty {
      min-height: 280px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text-muted);
      text-align: center;
      line-height: 1.7;
    }
    @media (max-width: 760px) {
      .topbar, .hero, .entry { align-items: stretch; flex-direction: column; }
      h1 { font-size: 34px; line-height: 1.08; }
      .stats, .actions { justify-content: flex-start; }
      .fit, .metric, .fit-reason { text-align: left; }
    }
    @media (max-width: 520px) {
      .shell { width: 100%; padding: 24px 16px 56px; overflow: hidden; }
      .nav { flex-direction: column; align-items: stretch; width: 100%; }
      .btn { width: 100%; }
      .goals { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
      .goal { flex: 0 0 auto; }
      .entry-main { align-items: flex-start; }
      .avatar { width: 42px; height: 42px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topbar">
      <a class="brand" href="/">vibestats</a>
      <div class="nav">
        <a class="btn" href="/">Upload</a>
        <a class="btn" href="/browse">Browse</a>
        <a class="btn primary" href="/settings">Set intent</a>
      </div>
    </nav>

    <section class="hero">
      <div>
        <div class="eyebrow">match by goal</div>
        <h1 id="title">Pair coding matches</h1>
        <p class="lead">Active public profiles. Links go out.</p>
      </div>
    </section>

    <section class="selector-group">
      <div class="selector-label">Goal</div>
      <nav class="goals" id="goals" aria-label="Match goals"></nav>
    </section>
    <section class="selector-group">
      <div class="selector-label">Your style</div>
      <nav class="goals" id="archetypes" aria-label="Match by your archetype"></nav>
    </section>
    <section class="list" id="list">
      <div class="empty">Loading matches...</div>
    </section>
  </main>

  <script>
    const GOALS = {
      'pair-coding': 'Pair coding',
      'co-founder': 'Co-founder',
      hire: 'Hiring',
      mentor: 'Mentor',
      mentee: 'Mentee',
    };
    const ARCHETYPE_NAMES = {
      orchestrator: 'Orchestrator', shipper: 'Shipper', architect: 'Architect',
      debugger: 'Debugger', polyglot: 'Polyglot', sprinter: 'Sprinter',
      deepdiver: 'Deep Diver', builder: 'Builder',
    };
    const ARCHETYPE_FILTERS = { any: 'Any style', ...ARCHETYPE_NAMES };

    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = (value) => {
      const n = Number(value || 0);
      if (!Number.isFinite(n)) return '-';
      if (n >= 1000) return Math.round(n).toLocaleString();
      return n % 1 === 0 ? String(n) : n.toFixed(1);
    };

    function stateFromLocation() {
      const params = new URLSearchParams(location.search);
      const goal = GOALS[params.get('goal')] ? params.get('goal') : 'pair-coding';
      const archetype = ARCHETYPE_FILTERS[params.get('archetype')] ? params.get('archetype') : 'any';
      return { goal, archetype };
    }

    function matchUrl(next = {}) {
      const state = { ...stateFromLocation(), ...next };
      const params = new URLSearchParams();
      if (state.goal !== 'pair-coding') params.set('goal', state.goal);
      if (state.archetype !== 'any') params.set('archetype', state.archetype);
      const query = params.toString();
      return query ? `/match?${query}` : '/match';
    }

    function renderChips(id, values, activeKey, paramName) {
      document.getElementById(id).innerHTML = Object.entries(values).map(([key, label]) => `
        <a class="goal ${key === activeKey ? 'active' : ''}" href="${matchUrl({ [paramName]: key })}">${esc(label)}</a>
      `).join('');
    }

    function renderGoals(active) {
      document.getElementById('goals').innerHTML = Object.entries(GOALS).map(([key, label]) => `
        <a class="goal ${key === active ? 'active' : ''}" href="${matchUrl({ goal: key })}">${esc(label)}</a>
      `).join('');
    }

    function comparePath(entry, seekerArchetype) {
      const handle = entry.user?.gh_handle || 'unknown';
      if (seekerArchetype && seekerArchetype !== 'any') {
        return `/compare?a=${encodeURIComponent(seekerArchetype)}&b=${encodeURIComponent(entry.archetype)}`;
      }
      return `/?compareTo=${encodeURIComponent(handle)}&compareArchetype=${encodeURIComponent(entry.archetype)}`;
    }

    function introText(entry, goalLabel, seekerArchetype) {
      const handle = entry.user?.gh_handle || 'there';
      const compareUrl = `${location.origin}${comparePath(entry, seekerArchetype)}`;
      const profileUrl = `${location.origin}/u/${encodeURIComponent(handle)}`;
      const style = seekerArchetype && seekerArchetype !== 'any' ? `I'm a ${ARCHETYPE_NAMES[seekerArchetype] || seekerArchetype}. ` : '';
      return `${style}Saw your vibestats profile - you're a ${entry.signature?.label || ARCHETYPE_NAMES[entry.archetype] || entry.archetype}. vibestats has us at ${entry.fit_score}% for ${goalLabel.toLowerCase()}: ${entry.fit_reason} Compare here: ${compareUrl}\n${profileUrl}`;
    }

    function xShareUrl(entry, goalLabel, seekerArchetype) {
      const handle = entry.user?.gh_handle || 'this profile';
      const text = `Found a ${entry.fit_score}% ${goalLabel.toLowerCase()} match with @${handle} on vibestats.`;
      return `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(`${location.origin}${comparePath(entry, seekerArchetype)}`)}`;
    }

    function renderEntries(entries, goalLabel, seekerArchetype) {
      const list = document.getElementById('list');
      if (!entries.length) {
        list.innerHTML = '<div class="empty">No active public matches for this goal yet.<br>Set your intent from Settings and make your profile public to appear here.</div>';
        return;
      }

      list.innerHTML = entries.map((entry) => {
        const handle = entry.user?.gh_handle || 'unknown';
        const activity = entry.activity || {};
        const avatar = entry.user?.avatar_url
          ? `<img class="avatar" src="${esc(entry.user.avatar_url)}" alt="@${esc(handle)}">`
          : '<div class="avatar" aria-hidden="true"></div>';
        const profilePath = `/u/${encodeURIComponent(handle)}`;
        const contactUrl = entry.match?.contact_url || profilePath;
        const intro = introText(entry, goalLabel, seekerArchetype);
        const comparison = comparePath(entry, seekerArchetype);
        return `
          <article class="entry">
            <div class="entry-main">
              ${avatar}
              <div class="identity">
                <a class="handle" href="${profilePath}">@${esc(handle)}</a>
                <div class="signature">${esc(entry.signature?.label || ARCHETYPE_NAMES[entry.archetype] || entry.archetype)}</div>
                <div class="meta">${esc(activity.days || 'fresh profile')} · ${esc(entry.score)}% ${esc(ARCHETYPE_NAMES[entry.archetype] || entry.archetype)} signal</div>
                <div class="intent">${esc(entry.match?.looking_for_label || 'Active')}</div>
              </div>
            </div>
            <div class="stats">
              <div class="fit ${esc(entry.fit_level || '')}"><strong>${esc(entry.fit_score)}%</strong><span class="score-label">goal fit</span></div>
              <div class="fit-reason">${esc(entry.fit_reason || '')}</div>
              <div class="metric"><strong>${esc(activity.cadence || 'private')}</strong>cadence</div>
              <div class="metric"><strong>${esc(activity.depth || 'private')}</strong>history</div>
            </div>
            <div class="actions">
              <a class="btn primary" href="${esc(comparison)}">Compare</a>
              <a class="btn" href="${esc(contactUrl)}" target="${contactUrl.startsWith('/') ? '_self' : '_blank'}" rel="noopener">Contact</a>
              <button class="btn" type="button" data-intro="${esc(intro)}">Copy intro</button>
              <a class="btn" href="${esc(xShareUrl(entry, goalLabel, seekerArchetype))}" target="_blank" rel="noopener">Share on X</a>
            </div>
          </article>
        `;
      }).join('');

      list.querySelectorAll('[data-intro]').forEach((button) => {
        button.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(button.getAttribute('data-intro'));
            button.textContent = 'Copied!';
            setTimeout(() => { button.textContent = 'Copy intro'; }, 1500);
          } catch {
            button.textContent = 'Copy failed';
            setTimeout(() => { button.textContent = 'Copy intro'; }, 1500);
          }
        });
      });
    }

    async function renderMatch() {
      const state = stateFromLocation();
      const label = GOALS[state.goal];
      renderGoals(state.goal);
      renderChips('archetypes', ARCHETYPE_FILTERS, state.archetype, 'archetype');
      const styleLabel = state.archetype !== 'any' ? `${ARCHETYPE_NAMES[state.archetype]} ` : '';
      document.title = `${styleLabel}${label} matches | vibestats`;
      document.getElementById('title').textContent = state.archetype !== 'any'
        ? `${ARCHETYPE_NAMES[state.archetype]} matches`
        : `${label} matches`;
      try {
        const params = new URLSearchParams({ goal: state.goal });
        if (state.archetype !== 'any') params.set('archetype', state.archetype);
        const res = await fetch(`/api/match?${params.toString()}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Match unavailable');
        renderEntries(data.entries || [], data.goal_label || label, data.seeker_archetype || state.archetype);
      } catch (err) {
        document.getElementById('list').innerHTML = `<div class="empty">Match unavailable.<br>${esc(err.message)}</div>`;
      }
    }

    renderMatch();
  </script>
</body>
</html>
